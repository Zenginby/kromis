# Android (arm64-v8a) APK'sını derler, imzalar ve doğrular — çağrılabilir iş.
#
# NEDEN masaüstü paketlerinden ayrı dosya: onların ikisi de PyInstaller
# dünyasında (aynı spec, aynı requirements). Bu iş başka bir araç zinciri
# (Gradle + Chaquopy + NDK), başka bir bağımlılık kümesi ve başka bir imzalama
# yolu kullanıyor.
#
# NE DEĞİŞTİ (eski build-android.yml'e göre): kendi `test` işi ve kendi
# `publish-android` işi KALKTI. Testi çağıran koşuyor (`_test.yml`, tek tanım);
# yayını da tek yazıcı oluşturuyor. İkinci yazıcı bilinçle silindi: v0.4.2'de
# yayını bu workflow 16:15:29'da APK ile oluşturup YAYIMLADI, masaüstü zip'leri
# 16:17:04'te eklendi — arada ~95 saniye boyunca yayın sayfasında yalnız APK
# vardı ve masaüstü işi kırmızıya düşseydi o eksik yayın öylece kalırdı.
#
# NEDEN BU KADAR SERT DOĞRULAMA: release.yml'de öğrenilen dersin aynısı —
# 2026-08-11'de "CI Windows paketi üretti" sanıldı, koşu YEŞİLDİ ama çıktı
# BOŞTU. Aşağıdaki her kapı o yanılgının bir yolunu kapatıyor: APK dosyası var
# mı, sürümü version.py ile aynı mı, İÇİNDE beklenen dosyalar var mı, Python
# çalışma zamanı gerçekten gömülmüş mü, imza geçerli mi.
#
# SIRLAR: çağıranın `secrets: inherit` demesi ŞART. Reusable workflow sırları
# kendiliğinden devralmaz; unutulursa keystore çözülemez ve `imza_zorunlu`
# açıkken iş (doğru biçimde) kırmızıya düşer.
name: Android paketi

on:
  workflow_call:
    inputs:
      ref:
        description: "Derlenecek commit (boşsa çağıranın ref'i)"
        type: string
        required: false
        default: ""
      imza_zorunlu:
        description: "true → imzasız APK işi kırmızıya düşürür (yayın yolu)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  # pydantic-core wheel'i — Chaquopy'nin kurabildiği TEK kaynak.
  #
  # Bu iş, wheel repoya işlenmişse onu olduğu gibi geçiriyor; işlenmemişse
  # önbellekten alıyor, o da yoksa derliyor. Yani APK derlemesi elle atılmış bir
  # adıma bağlı DEĞİL.
  #
  # `ref` GEÇİLMİYOR: wheel yalnızca android/pins.properties'e bağlı ve sürüm
  # commit'i o dosyaya dokunmuyor. Çiviler değişirse zaten wheel'in kendi
  # önbellek anahtarı ıskalar ve yeniden derlenir.
  wheel:
    name: pydantic-core wheel
    uses: ./.github/workflows/build-pydantic-core-android.yml

  paket:
    needs: wheel
    name: Android arm64-v8a paketi
    runs-on: ubuntu-latest
    # Chaquopy ilk koşuda Python çalışma zamanını ve tüm wheel'leri indirip
    # açıyor; Gradle önbelleği soğukken 30 dakikayı geçebiliyor.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # AGP 8.7 JDK 17 istiyor. Sürüm AÇIKÇA yazılı: runner imajının varsayılan
      # JDK'sı bir gün değişirse derleme sessizce başka bir bytecode hedefiyle
      # çıkardı.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # Chaquopy pip'i çalıştırmak için yerel bir Python istiyor ve sürümünün
      # HEDEFLE aynı olması gerekiyor (android/pins.properties: pythonVersion).
      - name: Chaquopy'nin buildPython'ı
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: gradle/actions/setup-gradle@v4

      # Wheel'i `wheel` işinden al. O iş üç kaynağı da (repo / önbellek /
      # derleme) tek bir varlığa indirgiyor, yani burada ayrım yapmaya gerek yok.
      #
      # `android/wheels/` içine iniyor çünkü `build.gradle` dosyayı ORADA, çivi
      # dosyasından kurduğu adla arıyor. Repoda zaten aynı ad varsa üzerine
      # aynı içerik yazılıyor — `wheel` işi o durumda repodaki dosyayı geçirmişti.
      - name: Wheel'i indir
        uses: actions/download-artifact@v4
        with:
          name: pydantic-core-android-arm64
          path: android/wheels

      # Kapı DURUYOR, yalnız artık elle atılmış bir adımı değil, bir önceki işin
      # teslimatını denetliyor: `wheel` işi yeşil olup da varlığı boş bırakırsa
      # (release.yml'de bedeli ödenen "yeşil ama boş" sınıfı) Gradle'ın hatası
      # Chaquopy pip çıktısının içinde kaybolurdu.
      - name: pydantic-core wheel'i yerinde mi
        run: |
          set -euo pipefail
          oku() { grep -E "^$1=" android/pins.properties | cut -d= -f2- | tr -d '[:space:]'; }
          CP="cp$(oku pythonVersion | tr -d '.')"
          W="android/wheels/pydantic_core-$(oku pydanticCoreVersion)-$CP-$CP-android_$(oku wheelAndroidApi)_arm64_v8a.whl"
          test -s "$W" || {
            echo "HATA: wheel yok ya da boş: $W"
            echo "  'wheel' işinin kaydına bak — varlığı o üretiyor."
            ls -l android/wheels/ || true
            exit 1
          }
          echo "wheel: $W ($(du -h "$W" | cut -f1))"

      - name: Keystore'u aç
        id: imza
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            # Sır tanımlı değilse iş DURMUYOR: bir dal derlemesinin amacı
            # derlemenin ayakta olduğunu görmek ve imzalama sırlarına erişimi
            # olmayan bir çatal (fork) da bunu koşabilmeli. Yayın yolunda ise
            # aşağıdaki kapı (imza_zorunlu) imzasız APK'yı geçirmiyor.
            #
            # BU BİR "DEBUG DERLEMESİ" DEĞİL: paket hiçbir anahtarla
            # imzalanmıyor ve Android imzasız paketi KURMAZ — telefonda
            # "paket geçersiz görünüyor" der. Eski metin "imzasız (debug)"
            # diyordu; "debug" kelimesi kurulabilir olduğunu ima ettiği için
            # imzasız bir APK telefona atıldı ve ancak orada anlaşıldı.
            # Uyarı hem loga hem koşu ÖZETİNE yazılıyor: varlığı indiren
            # kişi log satırlarını değil, koşu sayfasını görüyor.
            echo "UYARI: ANDROID_KEYSTORE_BASE64 yok — APK İMZASIZ derlenecek."
            echo "  İmzasız APK telefona KURULAMAZ ('paket geçersiz görünüyor')."
            echo "  Gerekli sırlar: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,"
            echo "  ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (docs/android/mimari.md → İmzalama)."
            {
              echo "### ⚠️ Bu APK İMZASIZ — telefona kurulamaz"
              echo
              echo "Android imzasız paketi kurmaz; \`Paket geçersiz görünüyor\` hatası verir."
              echo "Aşağıdaki varlık yalnızca **derlemenin ayakta olduğunu** gösterir."
              echo
              echo "Kurulabilir paket için dört GitHub Secret gerekiyor —"
              echo "\`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_KEYSTORE_PASSWORD\`,"
              echo "\`ANDROID_KEY_ALIAS\`, \`ANDROID_KEY_PASSWORD\`."
              echo "Anahtarın nasıl üretileceği: \`docs/android/mimari.md\` → İmzalama."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "imzali=hayir" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gis.keystore"
          test -s "$RUNNER_TEMP/gis.keystore" || { echo "HATA: keystore boş çözüldü"; exit 1; }
          echo "imzali=evet" >> "$GITHUB_OUTPUT"

      - name: Derle (assembleRelease)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.imza.outputs.imzali == 'evet' && format('{0}/gis.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PgisBuildPython=python3.13 :app:assembleRelease

      - name: APK'yı doğrula (iddiaların hepsi APK'nın İÇİ hakkında)
        id: dogrula
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/lumeo-android-arm64-release.apk"

          # (1) Paket GERÇEKTEN var mı? "Yeşil ama boş"un birinci kapısı.
          test -s "$APK" || {
            echo "HATA: APK üretilmemiş ya da boş: $APK"
            find android/app/build/outputs -type f 2>/dev/null | head -40 || true
            exit 1
          }
          echo "apk: $APK ($(du -h "$APK" | cut -f1))"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | head -5

          # (2) Sürüm. Bu adım aynı zamanda build.gradle'ın version.py'yi
          # DERLEME ZAMANINDA okumasının tek kanıtı — hiçbir pytest onu görmüyor
          # (macOS'ta Info.plist, Windows'ta VERSIONINFO için de böyleydi).
          BEKLENEN="$(python -c 'import version; print(version.APP_VERSION)')"
          GOT="$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          test "$GOT" = "$BEKLENEN" || { echo "HATA: versionName=$GOT, beklenen $BEKLENEN"; exit 1; }
          echo "versionName: $GOT"

          # (3) Tek ABI. İki ABI paketi neredeyse ikiye katlar ve bunu ancak
          # dosya boyutuna bakan biri fark ederdi.
          #
          # `aapt2` bu satırı TEK tırnakla yazıyor: native-code: 'arm64-v8a'
          # (run 31967618693 bunu yalnız çift tırnak silerek okudu ve "beklenen
          # arm64-v8a, bulunan: 'arm64-v8a'" diye düştü). İkisini de siliyoruz:
          # biçim aapt2 sürümüne göre değişse de kapı ABI'yi ölçmeye devam etsin.
          ABILER="$(echo "$BADGING" | sed -n "s/^native-code: //p" | tr -d "\"'")"
          test "$ABILER" = "arm64-v8a" || { echo "HATA: beklenen ABI arm64-v8a, bulunan: $ABILER"; exit 1; }

          # (4) İçerik. Üç ayrı sınıf: arayüz, gömülü varlıklar, Python
          # çalışma zamanı. Üçü de eksik olsa APK yine kurulur ve ancak
          # AÇILIŞTA, kullanıcıda patlardı.
          GIRDILER="$(unzip -Z1 "$APK")"
          echo "apk girdi sayısı: $(echo "$GIRDILER" | wc -l)"
          BEKLENENLER="
          assets/resources/static/index.html
          assets/resources/static/core.js
          assets/resources/static/mobile.css
          assets/resources/static/mobile.js
          assets/resources/static/fonts/dm-sans-v17-latin.woff2
          assets/resources/bundled/prompts/prompt-yonetmeni.md
          "
          EKSIK=""
          for f in $BEKLENENLER; do
            echo "$GIRDILER" | grep -qxF "$f" || EKSIK="$EKSIK $f"
          done
          test -z "$EKSIK" || { echo "HATA: APK'da EKSİK:$EKSIK"; exit 1; }

          # Python çalışma zamanı ve uygulamanın kendi modülleri.
          echo "$GIRDILER" | grep -q '^lib/arm64-v8a/libpython.*\.so$' \
            || { echo "HATA: APK'da libpython*.so yok — Chaquopy çalışma zamanı gömülmemiş"; exit 1; }
          echo "$GIRDILER" | grep -q '^assets/chaquopy/' \
            || { echo "HATA: APK'da assets/chaquopy/ yok"; exit 1; }
          echo "içerik kapıları geçildi"

      # `import pydantic` KAPISI — Faz 0'ın karar kuralının ikinci yarısı
      # (docs/android/pydantic-karari.md). Wheel'in üretilmiş olması yetmez;
      # Chaquopy'nin onu GERÇEKTEN kurmuş olması gerekiyor.
      #
      # NEREDE ARANIR: Chaquopy paketleri APK'ya ayrı girdi olarak KOYMUYOR —
      # hepsi `assets/chaquopy/*.imy` arşivlerinin içinde (`.imy`, aapt'ın
      # sıkıştırmaması için başka adlandırılmış bir ZIP). run 31968594609 bunu
      # APK girdi ADLARINDA aradı; pip kaydında "Successfully installed …
      # pydantic-2.13.4 pydantic-core-2.46.4" yazdığı hâlde eşleşme yoktu ve
      # kapı, ölçmesi gereken şeyi hiç ölçemeden düştü.
      - name: pydantic APK'ya girdi mi
        run: |
          set -euo pipefail
          APK="${{ steps.dogrula.outputs.apk }}"

          KLASOR="$(mktemp -d)"
          # `|| true`: eşleşme yoksa unzip 11 ile çıkıp `set -e`'yi tetikliyor ve
          # asıl teşhis ("chaquopy yok") yerine "filename not matched" görünüyor.
          # Kapıyı bir alttaki `test -d` kapatıyor.
          unzip -qo "$APK" 'assets/chaquopy/*' -d "$KLASOR" || true
          KOK="$KLASOR/assets/chaquopy"
          test -d "$KOK" || {
            echo "HATA: APK'da assets/chaquopy/ yok — Chaquopy hiç çalışmamış"
            exit 1
          }

          # Varlıkların dökümü her koşuda basılıyor: bu kapı bir daha yanlış
          # yere bakarsa hangi dosyaların orada olduğu logda hazır dursun.
          echo "chaquopy varlıkları:"
          (cd "$KOK" && find . -type f -printf '  %p (%s bayt)\n' | sort)

          ara() {
            modul="$1"
            while IFS= read -r dosya; do
              # (a) Dosya ZIP olarak okunabiliyorsa paket dizinini girdi
              #     adlarında ara — en kesin kanıt.
              if unzip -Z1 "$dosya" 2>/dev/null | grep -q "^$modul/"; then
                echo "  $modul -> ${dosya#"$KOK"/}"
                return 0
              fi
              # (b) Okunamıyorsa: ZIP girdi adları arşivin içinde SIKIŞTIRILMADAN
              #     durur, yani düz metin araması hâlâ geçerli bir kanıt.
              if grep -qa "$modul/__init__" "$dosya"; then
                echo "  $modul -> ${dosya#"$KOK"/} (düz metin eşleşmesi)"
                return 0
              fi
            done < <(find "$KOK" -type f)
            return 1
          }

          for modul in pydantic pydantic_core; do
            ara "$modul" || {
              echo "HATA: $modul APK'daki chaquopy varlıklarında yok — pip adımı onu kurmamış"
              exit 1
            }
          done
          echo "pydantic + pydantic_core APK'da"

      - name: İmzayı doğrula
        if: steps.imza.outputs.imzali == 'evet'
        run: |
          set -euo pipefail
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "${{ steps.dogrula.outputs.apk }}"

      # Yayın yolunda imzasız APK'ya izin YOK: kullanıcı onu kuramaz ve
      # "yayın çıktı ama kurulmuyor" en pahalı hata sınıfı.
      #
      # Kapı eskiden `startsWith(github.ref, 'refs/tags/')` bakıyordu. Artık
      # yayın tag'le değil main'e merge'le tetikleniyor, yani "yayın yolunda
      # mıyız" bilgisi ref'ten okunamaz — çağıran açıkça söylüyor.
      - name: Yayın yolunda imza ZORUNLU
        if: inputs.imza_zorunlu && steps.imza.outputs.imzali != 'evet'
        run: |
          echo "HATA: yayın derlemesi imzasız — imzalama sırları tanımlı değil."
          echo "  Gerekli sırlar: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,"
          echo "  ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
          echo "  Çağıran workflow'da 'secrets: inherit' var mı? Reusable workflow"
          echo "  sırları kendiliğinden devralmaz."
          exit 1

      # Varlığın adı = yayın varlığının adı = release_manifest.py'deki anahtar.
      # Eskiden burada `dist-` önekli bir ad vardı ve yayın işi onu `mv` ile
      # düzeltiyordu; o ara ad ayrışabilecek üçüncü bir isimdi (ve
      # tests/test_android_apk_name.py'nin ikinci testi tam olarak onu
      # kolluyordu). Tek ad, ayrışacak yer bırakmıyor.
      - name: Yayın adına kopyala
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${{ steps.dogrula.outputs.apk }}" dist/lumeo-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lumeo-android-arm64
          path: dist/lumeo-android-arm64.apk
          # "Yeşil ama boş"un SON kapısı: bu bayrak olmadan upload-artifact
          # eşleşen dosya bulamayınca yalnız UYARI basar ve iş yeşil kalır.
          if-no-files-found: error
          # SAKLAMA 1 GÜN — burası 30'du ve CI'ı kırdı. Bu varlığı okuyan tek
          # yer release.yml'in `yayinla` işi ve o AYNI KOŞUDAN indiriyor
          # (`download-artifact`e `run-id` verilmiyor); PR koşusunda ise varlığı
          # okuyan hiç kimse yok. 2026-08-28'de depoda 221 canlı varlık /
          # 3.98 GiB birikmişti ve üç paketleme işi de paketi DERLEYİP
          # DOĞRULADIKTAN sonra, yalnız yükleme adımında
          # "Artifact storage quota has been hit" ile kırmızıya düştü.
          # Bir gün yetiyor çünkü yayına giren ikililer zaten KALICI (yayın
          # varlığı olarak asılıyorlar) ve yarım kalan bir yayının belgelenmiş
          # onarımı tek işi değil BÜTÜN koşuyu yeniden başlatmak
          # (release.yml'deki idempotent `surum-yaz`) — yani günler öncesine
          # yaslanan bir kurtarma yolu yok.
          retention-days: 1
