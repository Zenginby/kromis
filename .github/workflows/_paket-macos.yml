# macOS arm64 paketi — çağrılabilir iş.
#
# NEDEN AYRI DOSYA: bu iş release.yml ile build-macos-arm64.yml'de neredeyse
# birebir iki kez duruyordu ve doğrulama listeleri ZATEN ayrışmıştı (dispatch
# kopyası `static/mobile.css` ile yazı tiplerini hiç kontrol etmiyordu). İki
# kopyadan biri gevşediğinde ötekinin sertliği kimseyi korumaz; tek tanım o
# ayrışmayı yapısal olarak imkânsız kılıyor. Burada kalan liste iki kopyanın
# BİRLEŞİMİ — hiçbir kapı gevşetilmedi.
#
# Bu iş yayına DOKUNMAZ, yalnızca varlık yükler. Yayını `release.yml`'deki tek
# yazıcı oluşturuyor (gerekçe orada yazılı: iki ayrı yazıcı v0.4.2'de yayını
# ~95 saniye boyunca eksik gösterdi).
name: macOS paketi

on:
  workflow_call:
    inputs:
      ref:
        description: "Derlenecek commit (boşsa çağıranın ref'i)"
        type: string
        required: false
        default: ""
      taslak:
        description: "Yüklenecek TASLAK yayının tag'i (boşsa hiçbir yere yüklenmez)"
        type: string
        required: false
        default: ""

# İZİN BLOĞU BİLEREK YOK — çağırandan DEVRALINIYOR.
#
# Paket, taslak yayına doğrudan yazıyor (aşağıda gerekçesi) ve bu `contents:
# write` istiyor. Burada sabit yazılamaz: çağrılan workflow çağıranından fazla
# izin isteyemez, yani `write` yazılsaydı `ci.yml` (contents: read) bu
# workflow'u HİÇ çağıramaz, PR'daki paketleme kapısı tümden düşerdi. Devralma
# ikisini de doğru yapıyor: `ci.yml` altında read (yükleme zaten atlanıyor,
# `taslak` boş), `release.yml` altında write.

jobs:
  paket:
    name: macOS arm64 paketi
    runs-on: macos-14          # arm64 (Apple Silicon) runner
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Mimariyi doğrula (yanlış runner'da sessizce x86_64 üretmesin)
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          echo "runner mimarisi: $ARCH"
          test "$ARCH" = "arm64" || { echo "HATA: arm64 bekleniyordu, $ARCH bulundu"; exit 1; }
          # PyInstaller runner'daki yorumlayıcıyı embed ediyor; runner mimarisinden bağımsız olarak
          # çalışabilir. İkisi ayrı kontrol edilir: runner donanımı (uname) ve Python binary'si (platform).
          python -c "import platform; plat=platform.machine(); print('python mimarisi:', plat); plat=='arm64' or exit(1)"

      # build.sh .venv'i kendisi oluşturuyor; bu adım yalnızca pip'i tazeliyor
      # (runner imajındaki pip eski olabilir).
      - name: pip'i tazele
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/pip install -q --upgrade pip

      - name: Derle (yerelde doğrulanan build.sh ile, değiştirmeden)
        run: ./build.sh

      - name: Paketi doğrula
        run: |
          set -euo pipefail
          APP="dist/Lumeo.app"
          lipo -archs "$APP/Contents/MacOS/Lumeo" | tee /dev/stderr | grep -qx arm64
          codesign --verify --strict "$APP"
          for f in static/index.html static/core.js static/viewer.js \
                   static/fonts.css static/mobile.css static/mobile.js \
                   static/fonts/dm-sans-v17-latin.woff2 \
                   static/fonts/dm-sans-v17-latin-ext.woff2 \
                   bundled/prompts/prompt-yonetmeni.md \
                   bundled/prompts/prompt-yonetmeni-video.md; do
            test -f "$APP/Contents/Resources/$f" || { echo "EKSİK: $f"; exit 1; }
          done
          # Info.plist'teki sürüm version.py ile aynı mı? Spec sürümü SPECPATH +
          # importlib ile okuyor; o zincirin GERÇEKTEN koştuğunu yalnızca bu adım
          # kanıtlar — plist'i PyInstaller üretiyor, hiçbir pytest onu görmüyor.
          EXPECTED="$(python -c 'import version; print(version.APP_VERSION)')"
          for k in CFBundleShortVersionString CFBundleVersion; do
            GOT="$(/usr/bin/plutil -extract "$k" raw -o - "$APP/Contents/Info.plist")"
            test "$GOT" = "$EXPECTED" || { echo "HATA: $k=$GOT, beklenen $EXPECTED"; exit 1; }
          done
          echo "Info.plist sürümü: $EXPECTED"
          du -sh "$APP" dist/*.zip
          # Yayın varlığının adı: release_manifest.py'deki anahtarla BİREBİR.
          # Ad kayarsa tests/test_release_manifest.py PR'da kırmızıya düşer.
          cp "dist/Lumeo.zip" "dist/lumeo-macOS-arm64.zip"

      # TESLİM: paket doğrudan TASLAK yayına yazılıyor — Actions varlığı olarak
      # DEĞİL.
      #
      # NEDEN DEĞİŞTİ. Eskiden paket `upload-artifact` ile yükleniyor, `yayinla`
      # işi indirip yayına asıyordu. 2026-08-28'de Actions varlık kotası doldu:
      # üç paket de hatasız DERLENDİ ve DOĞRULANDI, yalnız yükleme adımında
      # düştüler, yani yayın hattı kendi ürettiği ikilileri teslim edemediği
      # için kırıldı. Kota boşaltıldıktan sonra bile sayaç saatlerce dolu
      # kaldı. Yayın varlıkları (Releases altındakiler) o kotaya GİRMİYOR, yani
      # arada duran ara kopya kırılganlığın tek kaynağıydı; bu adım onu
      # kaldırıyor. Bayt akışı da kısalıyor: derleyen makineden doğrudan son
      # yerine.
      #
      # TEK YAZICI GÜVENCESİ BOZULMUYOR — v0.4.2'de bedeli ödenen "95 saniye
      # boyunca yarım yayın" sınıfı buraya ulaşamaz, çünkü yazılan şey TASLAK:
      # kullanıcıya görünmüyor ve tag'i bile yok. Yayın, üç paket de yerine
      # oturduktan sonra `yayinla` işinin tek `--draft=false` çağrısıyla, tek
      # anda doğuyor.
      #
      # "Yeşil ama boş"un bu yoldaki kapısı `set -euo pipefail` + `gh release
      # upload`: dosya yoksa gh sıfırdan farklı çıkıyor ve adım kırmızıya
      # düşüyor. Eski `if-no-files-found: error` bayrağının işi buydu.
      #
      # `--clobber`: yarım kalmış bir koşu yeniden başlatıldığında aynı ad
      # zaten taslakta olabilir; onarım yolu ikinci bir hatayla kesilmemeli.
      - name: Paketi taslak yayına yükle
        if: inputs.taslak != ''
        # KABUK AÇIKÇA BASH. Windows runner'ında `run:` varsayılanı pwsh'tir ve
        # orada `set -euo pipefail` bir komut bile değil — yani üstteki "eksik
        # dosya adımı kırmızıya düşürür" güvencesi sessizce yalan olurdu. Üç
        # platformda tek deyim: aynı komut, aynı kapı, tek mandal.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ inputs.taslak }}" "dist/lumeo-macOS-arm64.zip" --clobber
          echo "taslağa yüklendi: lumeo-macOS-arm64.zip"
