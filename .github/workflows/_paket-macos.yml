# macOS arm64 paketi — çağrılabilir iş.
#
# NEDEN AYRI DOSYA: bu iş release.yml ile build-macos-arm64.yml'de neredeyse
# birebir iki kez duruyordu ve doğrulama listeleri ZATEN ayrışmıştı (dispatch
# kopyası `static/mobile.css` ile yazı tiplerini hiç kontrol etmiyordu). İki
# kopyadan biri gevşediğinde ötekinin sertliği kimseyi korumaz; tek tanım o
# ayrışmayı yapısal olarak imkânsız kılıyor. Burada kalan liste iki kopyanın
# BİRLEŞİMİ — hiçbir kapı gevşetilmedi.
#
# Bu iş yayına DOKUNMAZ, yalnızca varlık yükler. Yayını `release.yml`'deki tek
# yazıcı oluşturuyor (gerekçe orada yazılı: iki ayrı yazıcı v0.4.2'de yayını
# ~95 saniye boyunca eksik gösterdi).
name: macOS paketi

on:
  workflow_call:
    inputs:
      ref:
        description: "Derlenecek commit (boşsa çağıranın ref'i)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  paket:
    name: macOS arm64 paketi
    runs-on: macos-14          # arm64 (Apple Silicon) runner
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Mimariyi doğrula (yanlış runner'da sessizce x86_64 üretmesin)
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          echo "runner mimarisi: $ARCH"
          test "$ARCH" = "arm64" || { echo "HATA: arm64 bekleniyordu, $ARCH bulundu"; exit 1; }
          # PyInstaller runner'daki yorumlayıcıyı embed ediyor; runner mimarisinden bağımsız olarak
          # çalışabilir. İkisi ayrı kontrol edilir: runner donanımı (uname) ve Python binary'si (platform).
          python -c "import platform; plat=platform.machine(); print('python mimarisi:', plat); plat=='arm64' or exit(1)"

      # build.sh .venv'i kendisi oluşturuyor; bu adım yalnızca pip'i tazeliyor
      # (runner imajındaki pip eski olabilir).
      - name: pip'i tazele
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/pip install -q --upgrade pip

      - name: Derle (yerelde doğrulanan build.sh ile, değiştirmeden)
        run: ./build.sh

      - name: Paketi doğrula
        run: |
          set -euo pipefail
          APP="dist/Lumeo.app"
          lipo -archs "$APP/Contents/MacOS/Lumeo" | tee /dev/stderr | grep -qx arm64
          codesign --verify --strict "$APP"
          for f in static/index.html static/core.js static/viewer.js \
                   static/fonts.css static/mobile.css static/mobile.js \
                   static/fonts/dm-sans-v17-latin.woff2 \
                   static/fonts/dm-sans-v17-latin-ext.woff2 \
                   bundled/prompts/prompt-yonetmeni.md; do
            test -f "$APP/Contents/Resources/$f" || { echo "EKSİK: $f"; exit 1; }
          done
          # Info.plist'teki sürüm version.py ile aynı mı? Spec sürümü SPECPATH +
          # importlib ile okuyor; o zincirin GERÇEKTEN koştuğunu yalnızca bu adım
          # kanıtlar — plist'i PyInstaller üretiyor, hiçbir pytest onu görmüyor.
          EXPECTED="$(python -c 'import version; print(version.APP_VERSION)')"
          for k in CFBundleShortVersionString CFBundleVersion; do
            GOT="$(/usr/bin/plutil -extract "$k" raw -o - "$APP/Contents/Info.plist")"
            test "$GOT" = "$EXPECTED" || { echo "HATA: $k=$GOT, beklenen $EXPECTED"; exit 1; }
          done
          echo "Info.plist sürümü: $EXPECTED"
          du -sh "$APP" dist/*.zip
          # Yayın varlığının adı: release_manifest.py'deki anahtarla BİREBİR.
          # Ad kayarsa tests/test_release_manifest.py PR'da kırmızıya düşer.
          cp "dist/Lumeo.zip" "dist/lumeo-macOS-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: lumeo-macos-arm64
          path: dist/lumeo-macOS-arm64.zip
          # "Yeşil ama boş"un SON kapısı: bu bayrak olmadan upload-artifact
          # eşleşen dosya bulamayınca yalnızca UYARI basar ve iş yeşil kalır —
          # 2026-08-11'de tam olarak bu oldu.
          if-no-files-found: error
          # SAKLAMA 1 GÜN — burası 30'du ve CI'ı kırdı. Bu varlığı okuyan tek
          # yer release.yml'in `yayinla` işi ve o AYNI KOŞUDAN indiriyor
          # (`download-artifact`e `run-id` verilmiyor); PR koşusunda ise varlığı
          # okuyan hiç kimse yok. 2026-08-28'de depoda 221 canlı varlık /
          # 3.98 GiB birikmişti ve üç paketleme işi de paketi DERLEYİP
          # DOĞRULADIKTAN sonra, yalnız yükleme adımında
          # "Artifact storage quota has been hit" ile kırmızıya düştü.
          # Bir gün yetiyor çünkü yayına giren ikililer zaten KALICI (yayın
          # varlığı olarak asılıyorlar) ve yarım kalan bir yayının belgelenmiş
          # onarımı tek işi değil BÜTÜN koşuyu yeniden başlatmak
          # (release.yml'deki idempotent `surum-yaz`) — yani günler öncesine
          # yaslanan bir kurtarma yolu yok.
          retention-days: 1
