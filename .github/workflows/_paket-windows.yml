# Windows x64 paketi — çağrılabilir iş.
#
# macOS işinden TAMAMEN ayrı: başka runner, başka betik (build.ps1), başka
# doğrulama. İkisi yalnızca `_test.yml`'i paylaşır.
#
# NEDEN BU KADAR SERT DOĞRULAMA: 2026-08-11'de bu depoda "CI Windows paketi
# üretti" sanıldı; koşu (31492697516) YEŞİLDİ ama çıktı BOŞTU. Yeşil bir koşu
# tek başına kanıt değildir — aşağıdaki her adım o yanılgının bir kapısını
# kapatıyor: paket dosyası var mı, İÇİNDE beklenen dosyalar var mı, exe'nin
# sürümü version.py ile aynı mı, artifact adımı boş bir yükleme yaptı mı.
#
# Bu iş yayına DOKUNMAZ, yalnızca varlık yükler (bkz. release.yml → yayinla).
name: Windows paketi

on:
  workflow_call:
    inputs:
      ref:
        description: "Derlenecek commit (boşsa çağıranın ref'i)"
        type: string
        required: false
        default: ""
      taslak:
        description: "Yüklenecek TASLAK yayının tag'i (boşsa hiçbir yere yüklenmez)"
        type: string
        required: false
        default: ""

# İZİN BLOĞU BİLEREK YOK — çağırandan DEVRALINIYOR.
#
# Paket, taslak yayına doğrudan yazıyor (aşağıda gerekçesi) ve bu `contents:
# write` istiyor. Burada sabit yazılamaz: çağrılan workflow çağıranından fazla
# izin isteyemez, yani `write` yazılsaydı `ci.yml` (contents: read) bu
# workflow'u HİÇ çağıramaz, PR'daki paketleme kapısı tümden düşerdi. Devralma
# ikisini de doğru yapıyor: `ci.yml` altında read (yükleme zaten atlanıyor,
# `taslak` boş), `release.yml` altında write.

jobs:
  paket:
    name: Windows x64 paketi
    runs-on: windows-latest
    # macOS işi 30 dakikada bitiyor; Windows runner'ı daha yavaş ve build.ps1
    # pip + tam pytest takımı + pyinstaller'ı sırayla koşuyor.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Mimariyi doğrula (yanlış runner'da sessizce arm64 üretmesin)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "runner mimarisi: $env:PROCESSOR_ARCHITECTURE"
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            Write-Host "HATA: AMD64 bekleniyordu, $env:PROCESSOR_ARCHITECTURE bulundu"
            exit 1
          }
          # macOS işindeki ikili kontrolün eşi: runner donanımı (env değişkeni) ve
          # PyInstaller'ın embed edeceği Python binary'si (platform) AYRI şeyler.
          # GitHub bir gün windows-latest'i arm64'e taşırsa bu adım olmadan paket
          # "windows-x64" adıyla arm64 çıkar ve kimse fark etmez.
          $plat = python -c "import platform; print(platform.machine())"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "python mimarisi: $plat"
          if ("$plat".Trim() -ne 'AMD64') { exit 1 }

      # macOS'taki "pip'i tazele" adımının karşılığı, ama İKİNCİ bir gerekçesi de
      # var: build.ps1 yorumlayıcıyı `py -3` ile arıyor ve runner imajında
      # setup-python'ın seçtiğinden BAŞKA sürümlere işaret eden bir `py`
      # başlatıcısı bulunabilir. .venv hazır bulunduğunda build.ps1 aramayı hiç
      # çalıştırmıyor, doğrudan onu kullanıyor — böylece paketin yukarıda seçilen
      # yorumlayıcıyla üretildiği garanti (build.ps1'e dokunmadan).
      - name: .venv oluştur + pip'i tazele
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .venv\Scripts\python.exe -m pip install -q --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # `shell: powershell` = Windows PowerShell 5.1, pwsh DEĞİL: build.ps1
      # bilinçle 5.1'e göre yazıldı (BOM'lu UTF-8, Compress-Archive yerine .NET
      # ZipFile, Activate.ps1'den kaçınma) ve hem geliştirici makinesinde hem
      # kullanıcıda çalışacak kabuk o. pwsh'te derlemek betiğin asıl hedef
      # kabuğunu hiç sınamazdı.
      - name: Derle (yerelde doğrulanan build.ps1 ile, değiştirmeden)
        shell: powershell
        run: .\build.ps1

      # Derleme adımı bilerek 5.1'de, bu adım runner'ın varsayılanı pwsh'te —
      # ama doğrulamanın SONUCU kabuk seçiminden bağımsız olacak biçimde yazıldı,
      # iki yerde: (a) zip girdi adları normalize ediliyor (5.1 ile pwsh aynı
      # zip'i farklı ayırıcıyla gösteriyor, aşağıda), (b) Türkçe iddia kod
      # noktalarından kuruluyor. Gerekçe: GitHub `run:` içeriğini BOM'SUZ UTF-8
      # dosyaya yazar, 5.1 ise BOM'suzu cp1254 sanır — yani kabuk değişince
      # bozulacak bir doğrulama, doğrulama değildir. Betik yerelde 5.1 ile
      # koşturularak sınandı.
      - name: Paketi doğrula (iddiaların hepsi zip'in İÇİ hakkında)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zipYol = 'dist\Kromis-windows.zip'

          # (1) Paket GERÇEKTEN var mı? "Yeşil ama boş" koşusunun birinci kapısı.
          if (-not (Test-Path -LiteralPath $zipYol)) {
            Write-Host "HATA: paket üretilmemiş: $zipYol"
            Write-Host '--- dist/ içeriği ---'
            if (Test-Path -LiteralPath 'dist') { Get-ChildItem -LiteralPath 'dist' -Recurse -Depth 1 | Select-Object -First 40 }
            exit 1
          }
          $zip = (Resolve-Path -LiteralPath $zipYol).Path
          $mb = [math]::Round((Get-Item -LiteralPath $zip).Length / 1MB, 1)
          Write-Host "paket: $zipYol ($mb MB)"

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $arsiv = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            # Girdi adları normalize ediliyor. Zip'in İÇİNDE ayırıcı '/' (bayt
            # düzeyinde doğrulandı, Python zipfile ile: 219/219 girdi '/'), ama
            # .NET Framework'ün ZipArchiveEntry.FullName'i onu okurken platform
            # ayırıcısına çeviriyor — yani AYNI zip, Windows PowerShell 5.1'de
            # '\', pwsh'te '/' görünüyor. Normalizasyon olmadan bu adım kabuk
            # sürümü değişince sessizce "dosya eksik" derdi.
            $girdiler = @($arsiv.Entries | ForEach-Object { $_.FullName -replace '\\', '/' })
          } finally { $arsiv.Dispose() }
          Write-Host "zip girdi sayısı: $($girdiler.Count)"

          # (2) Kısmi/boş zip. onedir paketi 200+ dosya taşıyor; eşik bilinçle
          # gevşek (Python sürümü değişince DLL sayısı oynar) — burada aranan
          # "tam sayı" değil, "zip'in içi boş değil" kanıtı.
          if ($girdiler.Count -lt 100) {
            Write-Host "HATA: zip beklenenden az girdi taşıyor ($($girdiler.Count))"
            exit 1
          }

          # (3) exe. Ada göre TEK eşleşme aranıyor: spec'teki `name` değişirse
          # build.ps1'in kendi kontrolü de bu da kırmızıya düşer.
          $exeGirdi = @($girdiler | Where-Object { $_ -like '*/Kromis.exe' })
          if ($exeGirdi.Count -ne 1) {
            Write-Host "HATA: zip'te 'Kromis.exe' beklendi, $($exeGirdi.Count) eşleşme bulundu"
            exit 1
          }
          Write-Host "exe girdisi: $($exeGirdi[0])"

          # (4) Veri dosyaları — macOS işinin Contents/Resources kontrolünün eşi.
          # Yol SONEKİ ile aranıyor, tam yolla DEĞİL: PyInstaller 6 datas'ı
          # `_internal/` altına koyuyor ve o yerleşim PyInstaller'ın kendi
          # meselesi. Burada iddia edilen tek şey dosyaların pakette OLDUĞU;
          # nerede durduklarını ürün kodu (paths.py) çözüyor ve o Faz 1'de
          # frozen uygulamada ayrıca doğrulandı.
          $beklenenler = @(
            'static/index.html', 'static/core.js', 'static/viewer.js',
            'static/palette.js', 'static/fonts.css',
            # Mobil katman: masaüstü paketinde de DURMALI. Dosya eksikse
            # uygulama hata vermez, yalnız dar pencerede yerleşim bozulur —
            # tam olarak sessiz kırılma sınıfı.
            'static/mobile.css', 'static/mobile.js',
            # Font ikili dosya: eksikliği hiçbir hata üretmez, yalnız harfler
            # yedek yazı tipiyle çizilir. O yüzden kapıya girdi.
            'static/fonts/dm-sans-v17-latin.woff2',
            'static/fonts/dm-sans-v17-latin-ext.woff2',
            'bundled/prompts/prompt-yonetmeni.md',
            'bundled/prompts/prompt-yonetmeni-video.md'
          )
          $eksik = @()
          foreach ($f in $beklenenler) {
            if (-not ($girdiler | Where-Object { $_ -like "*/$f" })) { $eksik += $f }
          }
          if ($eksik.Count -gt 0) {
            Write-Host "HATA: pakette EKSİK: $($eksik -join ', ')"
            exit 1
          }
          Write-Host "veri dosyaları tam: $($beklenenler -join ', ')"

          # (4b) .NET yapılandırması exe'nin YANINDA mı?
          #
          # `$beklenenler` listesine GİRMİYOR ve sebebi yerleşim: o liste yol
          # SONEKİYLE aranıyor (PyInstaller datas'ı `_internal/` altına koyuyor),
          # bu dosya ise tam tersini istiyor — CLR varsayılan AppDomain'in
          # config'ini `<exe yolu>.config` diye arar ve `_internal/` altındaki
          # bir kopyayı HİÇ okumaz. Yani "pakette bulundu" yetmez, YER şart:
          # yanlış yere düşmüş bir kopya "yapıldı" görünür, hiçbir şey yapmaz.
          # (`tests/test_paket_icerik_listesi.py` `$beklenenler`i ayrıştırıp
          # depoda arıyor; dosya depoda `branding/Kromis.exe.config` adıyla
          # durduğu için o listeye girseydi testi yanlış yere baktırırdı.)
          $cfg = @($girdiler | Where-Object { $_ -like '*/Kromis.exe.config' })
          if ($cfg.Count -ne 1 -or $cfg[0] -ne ($exeGirdi[0] + '.config')) {
            Write-Host "HATA: Kromis.exe.config exe'nin yaninda degil: $($cfg -join ', ')"
            exit 1
          }
          Write-Host "net yapilandirmasi: $($cfg[0])"

          # (5) Sürüm. exe zip'ten ÇIKARILIP okunuyor, dist/ içindeki kopyadan
          # değil: doğrulanan şey gönderilen dosyanın kendisi olmalı.
          # Bu adım aynı zamanda spec'in derleme-zamanı version.py yüklemesinin
          # GERÇEKTEN koştuğunun tek kanıtı — VERSIONINFO'yu PyInstaller üretiyor,
          # hiçbir pytest onu görmüyor (macOS'ta Info.plist için de böyle).
          $gecici = Join-Path $env:RUNNER_TEMP 'surum-denetimi'
          New-Item -ItemType Directory -Force -Path $gecici | Out-Null
          $hedef = Join-Path $gecici 'Kromis.exe'
          $arsiv = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            # GetEntry zip'teki HAM adı ister — normalize edilmiş hâli değil.
            $ham = ($arsiv.Entries | Where-Object { ($_.FullName -replace '\\', '/') -eq $exeGirdi[0] })[0]
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($ham, $hedef, $true)
          } finally { $arsiv.Dispose() }

          $beklenen = (python -c "import version; print(version.APP_VERSION)")
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $beklenen = "$beklenen".Trim()
          $bilgi = (Get-Item -LiteralPath $hedef).VersionInfo
          # FixedFileInfo DÖRT haneli (spec dördüncüyü 0 yapıyor); StringFileInfo
          # üç haneli. İkisi de ayrı ayrı denetleniyor: biri elle yazılırsa öteki
          # yakalar.
          $dortlu = "$($bilgi.FileMajorPart).$($bilgi.FileMinorPart).$($bilgi.FileBuildPart).$($bilgi.FilePrivatePart)"
          # CompanyName: sahiplik 2026-09-10'da `Zenginby`'ye geçti ve bu alan
          # ASCII'ye indi, o yüzden düz literal — cp1254/utf-8/ascii ASCII
          # baytlarda birebir aynı, yani iddia kabuğun dosya kodlamasına bağlı
          # değil.
          #
          # FileDescription: TÜRKÇE KARAKTER TURUNU ölçen alan. Bu güvence
          # 2026-09-10'da bir an KAYBOLDU — eski CompanyName ('İ', 'ğ' taşıyan)
          # ASCII bir sahiplikle değişince VERSIONINFO alanlarının tamamı ASCII
          # kaldı ve tur ölçülemez oldu. Aynı gün Kromis adlandırmasıyla geri
          # alındı: açıklama alanına bilinçli olarak 'ö', 'ü' ve em dash konuldu
          # (`kromis.spec`).
          #
          # NEDEN KOD NOKTALARINDAN: doğrulamanın KENDİSİ, ölçtüğü kodlama
          # kusuruna açık olmamalı. Bu YAML BOM'suz UTF-8 ve PowerShell 5.1
          # BOM'suz bir dosyayı cp1254 sanabiliyor — düz yazılmış bir 'ö'
          # literali o durumda sessizce başka bir dizeye dönüşür ve kapı, ölçtüğü
          # kusurun tam kendisiyle yanlış kırmızı verir. Bu proje Türkçe karakter
          # kodlamasından İKİ KEZ yandı (cp1254'e düşen geçmiş okuması; PS 5.1'in
          # BOM'suz dosyayı cp1254 sanması), o yüzden beklenti burada harf harf
          # kuruluyor.
          $sirket = 'Zenginby'
          $aciklama = 'Kromis Studio ' + [char]0x2014 + ' g' + [char]0xF6 + 'rsel ' + [char]0xFC + 'retim'
          $iddialar = @(
            @{ ad = 'FileVersion';     got = "$($bilgi.FileVersion)";     bek = $beklenen },
            @{ ad = 'ProductVersion';  got = "$($bilgi.ProductVersion)";  bek = $beklenen },
            @{ ad = 'FixedFileInfo';   got = $dortlu;                     bek = "$beklenen.0" },
            @{ ad = 'CompanyName';     got = "$($bilgi.CompanyName)";     bek = $sirket },
            @{ ad = 'FileDescription'; got = "$($bilgi.FileDescription)"; bek = $aciklama }
          )
          $hataVar = $false
          foreach ($i in $iddialar) {
            if ($i.got -ne $i.bek) {
              Write-Host "HATA: $($i.ad)=[$($i.got)], beklenen [$($i.bek)]"
              $hataVar = $true
            } else {
              Write-Host "$($i.ad): $($i.got)"
            }
          }
          if ($hataVar) { exit 1 }

          # Yayın varlığının adı: release_manifest.py'deki anahtarla BİREBİR.
          Copy-Item -LiteralPath $zip -Destination 'dist\kromis-windows-x64.zip' -Force

      # AÇILIŞ KAPISI — üstteki adımların HEPSİ zip'in İÇERİĞİ hakkında, hiçbiri
      # exe'yi ÇALIŞTIRMIYOR. Bu dosyanın kendi başlığı "yeşil bir koşu tek
      # başına kanıt değildir" diyor; kapatılmamış kapı buydu. v0.5.2'den beri
      # Windows paketi bu hâliyle yeşil koşudan geçip yayına çıktı ve
      # KULLANICIDA HİÇ AÇILMADI (2026-09-04): `webview.start()` → winforms →
      # `import clr` → clr_loader →
      #   "Failed to resolve Python.Runtime.Loader.Initialize from
      #    ...\_internal\pythonnet\runtime\Python.Runtime.dll"
      #
      # v0.3.0'da bu güvence VARDI ama ELDEYDİ: `kromis.spec`in başlığı
      # "paket ÇALIŞTIRILDI — pencere açıldı, hata.log yazılmadı" diye kaydediyor.
      # Elle yapılan doğrulama bir kez yapılır; bu adım onu her koşuya taşıyor.
      #
      # NEDEN PENCERE AÇMIYORUZ: runner'da GUI penceresi güvenilir değil ve
      # ölçmek istediğimiz şey zaten pencere değil, ONDAN ÖNCEKİ halka — .NET
      # köprüsünün çözülmesi. `Kromis.exe --onyukleme-denetimi` (desktop.py) tam
      # olarak onu yapıyor: kademe kademe `import clr` → AddReference →
      # winforms → `guilib.initialize()`, sonra rapor dosyası + çıkış kodu.
      # `console=False` olduğu için stdout YOK; raporun tek çıkış yolu o dosya
      # ve onu görmenin tek yolu koşu günlüğü (varlık deposuna yüklemek yasak —
      # tests/test_release_manifest.py, 2026-08-28 kotası).
      #
      # NEDEN İKİ SENARYO: (a) MOTW'siz = bugüne dek elde doğrulanan hâl,
      # (b) MOTW'li = KULLANICININ hâli. İnternetten inen zip Dosya Gezgini ile
      # açıldığında ÇIKAN HER DOSYAYA `Zone.Identifier` akışı yapışıyor ve .NET
      # güvenilmeyen bölgeden assembly yüklemeyi reddedebiliyor. `ZipFile` bu
      # akışı YAYMIYOR (yalnız Gezgin yayıyor), o yüzden burada ELLE basılıyor —
      # yoksa (b) sessizce (a)'nın kopyası olurdu: iki yeşil koşu, tek ölçüm.
      #
      # Hangisinin düştüğü DOĞRUDAN teşhis:
      #   (a) düşerse → sorun pythonnet/clr_loader yığınında (requirements.txt)
      #   (b) düşerse → sorun MOTW'de (Kromis.exe.config + winclr + KURULUM.md)
      #
      # `if:` YOK: PR'da da (ci.yml) yayın yolunda da koşmalı — kapının bütün
      # anlamı bu.
      - name: Açılış denetimi (MOTW'siz ve MOTW'li — kullanıcının ortamı)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zip   = (Resolve-Path -LiteralPath 'dist\Kromis-windows.zip').Path
          $veri  = Join-Path $env:LOCALAPPDATA 'Kromis'
          $rapor = 'onyukleme-denetimi.txt'
          $hataVar = $false

          foreach ($senaryo in @(
            @{ ad = "MOTW yok (yerelde derlenen paket)"; motw = $false },
            @{ ad = "MOTW var (indirilmis zip)";         motw = $true  }
          )) {
            Write-Host "=== acilis denetimi: $($senaryo.ad) ==="

            # Her senaryo KENDİ dizinine açılıyor: ilk koşunun bıraktığı durum
            # ikincisini yanıltmamalı.
            $kok = Join-Path $env:RUNNER_TEMP ("acilis-" + [guid]::NewGuid().ToString('N'))
            [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $kok)
            $exe = @(Get-ChildItem -LiteralPath $kok -Recurse -Filter 'Kromis.exe')[0]
            if (-not $exe) { Write-Host 'HATA: cikarilan agacta Kromis.exe yok'; exit 1 }

            if ($senaryo.motw) {
              # [ZoneTransfer]/ZoneId=3 = "internetten geldi" — Gezgin'in zip
              # çıkarıcısının yaptığının birebir aynısı. Ağacın TAMAMINA
              # basılıyor: `winclr`ın dar tarama listesinin körlüğü burada
              # kırmızıya düşsün diye.
              #
              # `-Encoding ascii` AÇIKÇA: 5.1'in varsayılanı ANSI, pwsh 7'ninki
              # UTF8. BOM'lu bir akış `[ZoneTransfer]` başlığını tanınmaz kılar,
              # yani damga "var görünür ama yok" olur ve bu adım hiçbir şey
              # ölçmeden yeşil kalırdı. Bu depo kodlamadan iki kez yandı (bkz.
              # üstteki CompanyName gerekçesi); doğrulamanın KENDİSİ kodlama
              # kusuruna açık olamaz.
              $dosyalar = @(Get-ChildItem -LiteralPath $kok -Recurse -File)
              foreach ($f in $dosyalar) {
                Set-Content -LiteralPath $f.FullName -Stream 'Zone.Identifier' `
                            -Value "[ZoneTransfer]`r`nZoneId=3" -Encoding ascii
              }
              # ÖNCÜL DOĞRULAMASI. Bu blok olmadan senaryo (b) senaryo (a)
              # olurdu — ADS yazılamadığı gün adım hiçbir şey ölçmeden yeşil
              # kalır ve yalan söyler.
              $damgali = @($dosyalar | Where-Object {
                Get-Item -LiteralPath $_.FullName -Stream 'Zone.Identifier' -ErrorAction SilentlyContinue })
              Write-Host "MOTW damgasi: $($damgali.Count)/$($dosyalar.Count) dosya"
              if ($damgali.Count -ne $dosyalar.Count) {
                Write-Host 'HATA: damga butun dosyalara yapismadi — bu senaryo hicbir sey olcmez'
                exit 1
              }
              $ornek = Get-Content -LiteralPath $exe.FullName -Stream 'Zone.Identifier' -Raw
              if ($ornek -notmatch 'ZoneId=3') {
                Write-Host "HATA: Zone.Identifier icerigi beklenmedik: $ornek"
                exit 1
              }
            }

            # Önceki koşunun kaydı silinsin ki aşağıda basılan hata.log BU
            # koşuya ait olsun — yoksa teşhis yanlış senaryoya bakar.
            Remove-Item -Path (Join-Path $veri 'hata.log*') -Force -ErrorAction SilentlyContinue
            Remove-Item -Path (Join-Path $veri $rapor)      -Force -ErrorAction SilentlyContinue

            # `& $exe` KAPI DEĞİLDİR. Paket `console=False` (GUI alt sistemi):
            # kabuk böyle bir exe'yi BEKLEMEZ, hemen döner ve $LASTEXITCODE o
            # sürecin kodu bile olmaz — `&` ile yazılmış bir kapı, uygulama hiç
            # açılmasa da yeşil kalırdı, yani bu adımın var olma sebebinin tam
            # tersi.
            #
            # `-NoNewWindow` = UseShellExecute FALSE. Start-Process varsayılanı
            # ShellExecute'tur ve MOTW'li bir exe'de SmartScreen diyaloğunu
            # tetikleyebilir: modal pencere runner'da sonsuza kadar bekler.
            # Ölçtüğümüz şey SmartScreen değil, assembly yükleme BÖLGESİ.
            $p = Start-Process -FilePath $exe.FullName -ArgumentList '--onyukleme-denetimi' `
                               -WorkingDirectory $exe.DirectoryName -NoNewWindow -PassThru

            # Zaman aşımı SÜS DEĞİL: açılış hatasında desktop.py MessageBox
            # gösteriyor (modal) ve iş 45 dakikalık tavana çarpardı — kırmızının
            # SEBEBİ de görünmez olurdu.
            if (-not $p.WaitForExit(120000)) {
              $p.Kill()
              $hataVar = $true
              Write-Host 'HATA: acilis denetimi 120 sn icinde bitmedi (modal uyari ya da asili kalma)'
            } elseif ($p.ExitCode -ne 0) {
              $hataVar = $true
              Write-Host "HATA: acilis denetimi cikis kodu $($p.ExitCode)"
            } else {
              Write-Host "gecti: $($senaryo.ad)"
            }

            # Rapor ve hata kaydı HER DURUMDA basılıyor, yalnız kırmızıda değil:
            # geçen bir koşunun raporu da bilgi taşıyor (seçilen arka uç, DLL
            # boyutu, .NET sürümü) ve sessiz bir gerileme ancak orada görünür.
            foreach ($ad in @($rapor, 'hata.log', 'hata.log.1')) {
              $yol = Join-Path $veri $ad
              if (Test-Path -LiteralPath $yol) {
                Write-Host "--- $ad ---"
                Get-Content -LiteralPath $yol -Encoding utf8
              }
            }
            if (-not (Test-Path -LiteralPath (Join-Path $veri $rapor))) {
              $hataVar = $true
              Write-Host 'HATA: rapor dosyasi hic yazilmamis — surec raporu yazmadan oldu'
            }

            Remove-Item -LiteralPath $kok -Recurse -Force -ErrorAction SilentlyContinue
          }

          if ($hataVar) { exit 1 }

      # TESLİM: paket doğrudan TASLAK yayına yazılıyor — Actions varlığı olarak
      # DEĞİL.
      #
      # NEDEN DEĞİŞTİ. Eskiden paket `upload-artifact` ile yükleniyor, `yayinla`
      # işi indirip yayına asıyordu. 2026-08-28'de Actions varlık kotası doldu:
      # üç paket de hatasız DERLENDİ ve DOĞRULANDI, yalnız yükleme adımında
      # düştüler, yani yayın hattı kendi ürettiği ikilileri teslim edemediği
      # için kırıldı. Kota boşaltıldıktan sonra bile sayaç saatlerce dolu
      # kaldı. Yayın varlıkları (Releases altındakiler) o kotaya GİRMİYOR, yani
      # arada duran ara kopya kırılganlığın tek kaynağıydı; bu adım onu
      # kaldırıyor. Bayt akışı da kısalıyor: derleyen makineden doğrudan son
      # yerine.
      #
      # TEK YAZICI GÜVENCESİ BOZULMUYOR — v0.4.2'de bedeli ödenen "95 saniye
      # boyunca yarım yayın" sınıfı buraya ulaşamaz, çünkü yazılan şey TASLAK:
      # kullanıcıya görünmüyor ve tag'i bile yok. Yayın, üç paket de yerine
      # oturduktan sonra `yayinla` işinin tek `--draft=false` çağrısıyla, tek
      # anda doğuyor.
      #
      # "Yeşil ama boş"un bu yoldaki kapısı `set -euo pipefail` + `gh release
      # upload`: dosya yoksa gh sıfırdan farklı çıkıyor ve adım kırmızıya
      # düşüyor. Eski `if-no-files-found: error` bayrağının işi buydu.
      #
      # `--clobber`: yarım kalmış bir koşu yeniden başlatıldığında aynı ad
      # zaten taslakta olabilir; onarım yolu ikinci bir hatayla kesilmemeli.
      - name: Paketi taslak yayına yükle
        if: inputs.taslak != ''
        # KABUK AÇIKÇA BASH. Windows runner'ında `run:` varsayılanı pwsh'tir ve
        # orada `set -euo pipefail` bir komut bile değil — yani üstteki "eksik
        # dosya adımı kırmızıya düşürür" güvencesi sessizce yalan olurdu. Üç
        # platformda tek deyim: aynı komut, aynı kapı, tek mandal.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ inputs.taslak }}" "dist/kromis-windows-x64.zip" --clobber
          echo "taslağa yüklendi: kromis-windows-x64.zip"
