# Windows x64 paketi — çağrılabilir iş.
#
# macOS işinden TAMAMEN ayrı: başka runner, başka betik (build.ps1), başka
# doğrulama. İkisi yalnızca `_test.yml`'i paylaşır.
#
# NEDEN BU KADAR SERT DOĞRULAMA: 2026-08-11'de bu depoda "CI Windows paketi
# üretti" sanıldı; koşu (31492697516) YEŞİLDİ ama çıktı BOŞTU. Yeşil bir koşu
# tek başına kanıt değildir — aşağıdaki her adım o yanılgının bir kapısını
# kapatıyor: paket dosyası var mı, İÇİNDE beklenen dosyalar var mı, exe'nin
# sürümü version.py ile aynı mı, artifact adımı boş bir yükleme yaptı mı.
#
# Bu iş yayına DOKUNMAZ, yalnızca varlık yükler (bkz. release.yml → yayinla).
name: Windows paketi

on:
  workflow_call:
    inputs:
      ref:
        description: "Derlenecek commit (boşsa çağıranın ref'i)"
        type: string
        required: false
        default: ""
      taslak:
        description: "Yüklenecek TASLAK yayının tag'i (boşsa hiçbir yere yüklenmez)"
        type: string
        required: false
        default: ""

# İZİN BLOĞU BİLEREK YOK — çağırandan DEVRALINIYOR.
#
# Paket, taslak yayına doğrudan yazıyor (aşağıda gerekçesi) ve bu `contents:
# write` istiyor. Burada sabit yazılamaz: çağrılan workflow çağıranından fazla
# izin isteyemez, yani `write` yazılsaydı `ci.yml` (contents: read) bu
# workflow'u HİÇ çağıramaz, PR'daki paketleme kapısı tümden düşerdi. Devralma
# ikisini de doğru yapıyor: `ci.yml` altında read (yükleme zaten atlanıyor,
# `taslak` boş), `release.yml` altında write.

jobs:
  paket:
    name: Windows x64 paketi
    runs-on: windows-latest
    # macOS işi 30 dakikada bitiyor; Windows runner'ı daha yavaş ve build.ps1
    # pip + tam pytest takımı + pyinstaller'ı sırayla koşuyor.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Mimariyi doğrula (yanlış runner'da sessizce arm64 üretmesin)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "runner mimarisi: $env:PROCESSOR_ARCHITECTURE"
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            Write-Host "HATA: AMD64 bekleniyordu, $env:PROCESSOR_ARCHITECTURE bulundu"
            exit 1
          }
          # macOS işindeki ikili kontrolün eşi: runner donanımı (env değişkeni) ve
          # PyInstaller'ın embed edeceği Python binary'si (platform) AYRI şeyler.
          # GitHub bir gün windows-latest'i arm64'e taşırsa bu adım olmadan paket
          # "windows-x64" adıyla arm64 çıkar ve kimse fark etmez.
          $plat = python -c "import platform; print(platform.machine())"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "python mimarisi: $plat"
          if ("$plat".Trim() -ne 'AMD64') { exit 1 }

      # macOS'taki "pip'i tazele" adımının karşılığı, ama İKİNCİ bir gerekçesi de
      # var: build.ps1 yorumlayıcıyı `py -3` ile arıyor ve runner imajında
      # setup-python'ın seçtiğinden BAŞKA sürümlere işaret eden bir `py`
      # başlatıcısı bulunabilir. .venv hazır bulunduğunda build.ps1 aramayı hiç
      # çalıştırmıyor, doğrudan onu kullanıyor — böylece paketin yukarıda seçilen
      # yorumlayıcıyla üretildiği garanti (build.ps1'e dokunmadan).
      - name: .venv oluştur + pip'i tazele
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .venv\Scripts\python.exe -m pip install -q --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # `shell: powershell` = Windows PowerShell 5.1, pwsh DEĞİL: build.ps1
      # bilinçle 5.1'e göre yazıldı (BOM'lu UTF-8, Compress-Archive yerine .NET
      # ZipFile, Activate.ps1'den kaçınma) ve hem geliştirici makinesinde hem
      # kullanıcıda çalışacak kabuk o. pwsh'te derlemek betiğin asıl hedef
      # kabuğunu hiç sınamazdı.
      - name: Derle (yerelde doğrulanan build.ps1 ile, değiştirmeden)
        shell: powershell
        run: .\build.ps1

      # Derleme adımı bilerek 5.1'de, bu adım runner'ın varsayılanı pwsh'te —
      # ama doğrulamanın SONUCU kabuk seçiminden bağımsız olacak biçimde yazıldı,
      # iki yerde: (a) zip girdi adları normalize ediliyor (5.1 ile pwsh aynı
      # zip'i farklı ayırıcıyla gösteriyor, aşağıda), (b) Türkçe iddia kod
      # noktalarından kuruluyor. Gerekçe: GitHub `run:` içeriğini BOM'SUZ UTF-8
      # dosyaya yazar, 5.1 ise BOM'suzu cp1254 sanır — yani kabuk değişince
      # bozulacak bir doğrulama, doğrulama değildir. Betik yerelde 5.1 ile
      # koşturularak sınandı.
      - name: Paketi doğrula (iddiaların hepsi zip'in İÇİ hakkında)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zipYol = 'dist\Lumeo-windows.zip'

          # (1) Paket GERÇEKTEN var mı? "Yeşil ama boş" koşusunun birinci kapısı.
          if (-not (Test-Path -LiteralPath $zipYol)) {
            Write-Host "HATA: paket üretilmemiş: $zipYol"
            Write-Host '--- dist/ içeriği ---'
            if (Test-Path -LiteralPath 'dist') { Get-ChildItem -LiteralPath 'dist' -Recurse -Depth 1 | Select-Object -First 40 }
            exit 1
          }
          $zip = (Resolve-Path -LiteralPath $zipYol).Path
          $mb = [math]::Round((Get-Item -LiteralPath $zip).Length / 1MB, 1)
          Write-Host "paket: $zipYol ($mb MB)"

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $arsiv = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            # Girdi adları normalize ediliyor. Zip'in İÇİNDE ayırıcı '/' (bayt
            # düzeyinde doğrulandı, Python zipfile ile: 219/219 girdi '/'), ama
            # .NET Framework'ün ZipArchiveEntry.FullName'i onu okurken platform
            # ayırıcısına çeviriyor — yani AYNI zip, Windows PowerShell 5.1'de
            # '\', pwsh'te '/' görünüyor. Normalizasyon olmadan bu adım kabuk
            # sürümü değişince sessizce "dosya eksik" derdi.
            $girdiler = @($arsiv.Entries | ForEach-Object { $_.FullName -replace '\\', '/' })
          } finally { $arsiv.Dispose() }
          Write-Host "zip girdi sayısı: $($girdiler.Count)"

          # (2) Kısmi/boş zip. onedir paketi 200+ dosya taşıyor; eşik bilinçle
          # gevşek (Python sürümü değişince DLL sayısı oynar) — burada aranan
          # "tam sayı" değil, "zip'in içi boş değil" kanıtı.
          if ($girdiler.Count -lt 100) {
            Write-Host "HATA: zip beklenenden az girdi taşıyor ($($girdiler.Count))"
            exit 1
          }

          # (3) exe. Ada göre TEK eşleşme aranıyor: spec'teki `name` değişirse
          # build.ps1'in kendi kontrolü de bu da kırmızıya düşer.
          $exeGirdi = @($girdiler | Where-Object { $_ -like '*/Lumeo.exe' })
          if ($exeGirdi.Count -ne 1) {
            Write-Host "HATA: zip'te 'Lumeo.exe' beklendi, $($exeGirdi.Count) eşleşme bulundu"
            exit 1
          }
          Write-Host "exe girdisi: $($exeGirdi[0])"

          # (4) Veri dosyaları — macOS işinin Contents/Resources kontrolünün eşi.
          # Yol SONEKİ ile aranıyor, tam yolla DEĞİL: PyInstaller 6 datas'ı
          # `_internal/` altına koyuyor ve o yerleşim PyInstaller'ın kendi
          # meselesi. Burada iddia edilen tek şey dosyaların pakette OLDUĞU;
          # nerede durduklarını ürün kodu (paths.py) çözüyor ve o Faz 1'de
          # frozen uygulamada ayrıca doğrulandı.
          $beklenenler = @(
            'static/index.html', 'static/core.js', 'static/viewer.js',
            'static/palette.js', 'static/fonts.css',
            # Mobil katman: masaüstü paketinde de DURMALI. Dosya eksikse
            # uygulama hata vermez, yalnız dar pencerede yerleşim bozulur —
            # tam olarak sessiz kırılma sınıfı.
            'static/mobile.css', 'static/mobile.js',
            # Font ikili dosya: eksikliği hiçbir hata üretmez, yalnız harfler
            # yedek yazı tipiyle çizilir. O yüzden kapıya girdi.
            'static/fonts/dm-sans-v17-latin.woff2',
            'static/fonts/dm-sans-v17-latin-ext.woff2',
            'bundled/prompts/prompt-yonetmeni.md'
          )
          $eksik = @()
          foreach ($f in $beklenenler) {
            if (-not ($girdiler | Where-Object { $_ -like "*/$f" })) { $eksik += $f }
          }
          if ($eksik.Count -gt 0) {
            Write-Host "HATA: pakette EKSİK: $($eksik -join ', ')"
            exit 1
          }
          Write-Host "veri dosyaları tam: $($beklenenler -join ', ')"

          # (5) Sürüm. exe zip'ten ÇIKARILIP okunuyor, dist/ içindeki kopyadan
          # değil: doğrulanan şey gönderilen dosyanın kendisi olmalı.
          # Bu adım aynı zamanda spec'in derleme-zamanı version.py yüklemesinin
          # GERÇEKTEN koştuğunun tek kanıtı — VERSIONINFO'yu PyInstaller üretiyor,
          # hiçbir pytest onu görmüyor (macOS'ta Info.plist için de böyle).
          $gecici = Join-Path $env:RUNNER_TEMP 'surum-denetimi'
          New-Item -ItemType Directory -Force -Path $gecici | Out-Null
          $hedef = Join-Path $gecici 'Lumeo.exe'
          $arsiv = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            # GetEntry zip'teki HAM adı ister — normalize edilmiş hâli değil.
            $ham = ($arsiv.Entries | Where-Object { ($_.FullName -replace '\\', '/') -eq $exeGirdi[0] })[0]
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($ham, $hedef, $true)
          } finally { $arsiv.Dispose() }

          $beklenen = (python -c "import version; print(version.APP_VERSION)")
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $beklenen = "$beklenen".Trim()
          $bilgi = (Get-Item -LiteralPath $hedef).VersionInfo
          # FixedFileInfo DÖRT haneli (spec dördüncüyü 0 yapıyor); StringFileInfo
          # üç haneli. İkisi de ayrı ayrı denetleniyor: biri elle yazılırsa öteki
          # yakalar.
          $dortlu = "$($bilgi.FileMajorPart).$($bilgi.FileMinorPart).$($bilgi.FileBuildPart).$($bilgi.FilePrivatePart)"
          # CompanyName kodlama kapısı: bu proje Türkçe karakter kodlamasından iki
          # kez yandı (cp1254'e düşen geçmiş okuması; PS 5.1'in BOM'suz dosyayı
          # cp1254 sanması). Beklenti "Kurum Derneği" diye YAZILMIYOR, KOD
          # NOKTALARINDAN kuruluyor — çünkü bu betiği kabuk BOM'suz bir dosyadan
          # okuyor ve literal yazılsaydı iddia kabuğun dosya kodlamasına bağlı
          # olurdu: doğrulamanın kendisi kodlama kusuruna açık olamaz. 0x130='İ',
          # 0x11F='ğ' (Faz 2'de exe'den bayt düzeyinde okunan değerler).
          $sirket = -join (@(0x130,0x6C,0x61,0x20,0x44,0x65,0x72,0x6E,0x65,0x11F,0x69) | ForEach-Object { [char]$_ })
          $iddialar = @(
            @{ ad = 'FileVersion';    got = "$($bilgi.FileVersion)";    bek = $beklenen },
            @{ ad = 'ProductVersion'; got = "$($bilgi.ProductVersion)"; bek = $beklenen },
            @{ ad = 'FixedFileInfo';  got = $dortlu;                    bek = "$beklenen.0" },
            @{ ad = 'CompanyName';    got = "$($bilgi.CompanyName)";    bek = $sirket }
          )
          $hataVar = $false
          foreach ($i in $iddialar) {
            if ($i.got -ne $i.bek) {
              Write-Host "HATA: $($i.ad)=[$($i.got)], beklenen [$($i.bek)]"
              $hataVar = $true
            } else {
              Write-Host "$($i.ad): $($i.got)"
            }
          }
          if ($hataVar) { exit 1 }

          # Yayın varlığının adı: release_manifest.py'deki anahtarla BİREBİR.
          Copy-Item -LiteralPath $zip -Destination 'dist\lumeo-windows-x64.zip' -Force

      # TESLİM: paket doğrudan TASLAK yayına yazılıyor — Actions varlığı olarak
      # DEĞİL.
      #
      # NEDEN DEĞİŞTİ. Eskiden paket `upload-artifact` ile yükleniyor, `yayinla`
      # işi indirip yayına asıyordu. 2026-08-28'de Actions varlık kotası doldu:
      # üç paket de hatasız DERLENDİ ve DOĞRULANDI, yalnız yükleme adımında
      # düştüler, yani yayın hattı kendi ürettiği ikilileri teslim edemediği
      # için kırıldı. Kota boşaltıldıktan sonra bile sayaç saatlerce dolu
      # kaldı. Yayın varlıkları (Releases altındakiler) o kotaya GİRMİYOR, yani
      # arada duran ara kopya kırılganlığın tek kaynağıydı; bu adım onu
      # kaldırıyor. Bayt akışı da kısalıyor: derleyen makineden doğrudan son
      # yerine.
      #
      # TEK YAZICI GÜVENCESİ BOZULMUYOR — v0.4.2'de bedeli ödenen "95 saniye
      # boyunca yarım yayın" sınıfı buraya ulaşamaz, çünkü yazılan şey TASLAK:
      # kullanıcıya görünmüyor ve tag'i bile yok. Yayın, üç paket de yerine
      # oturduktan sonra `yayinla` işinin tek `--draft=false` çağrısıyla, tek
      # anda doğuyor.
      #
      # "Yeşil ama boş"un bu yoldaki kapısı `set -euo pipefail` + `gh release
      # upload`: dosya yoksa gh sıfırdan farklı çıkıyor ve adım kırmızıya
      # düşüyor. Eski `if-no-files-found: error` bayrağının işi buydu.
      #
      # `--clobber`: yarım kalmış bir koşu yeniden başlatıldığında aynı ad
      # zaten taslakta olabilir; onarım yolu ikinci bir hatayla kesilmemeli.
      - name: Paketi taslak yayına yükle
        if: inputs.taslak != ''
        # KABUK AÇIKÇA BASH. Windows runner'ında `run:` varsayılanı pwsh'tir ve
        # orada `set -euo pipefail` bir komut bile değil — yani üstteki "eksik
        # dosya adımı kırmızıya düşürür" güvencesi sessizce yalan olurdu. Üç
        # platformda tek deyim: aynı komut, aynı kapı, tek mandal.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ inputs.taslak }}" "dist/lumeo-windows-x64.zip" --clobber
          echo "taslağa yüklendi: lumeo-windows-x64.zip"
