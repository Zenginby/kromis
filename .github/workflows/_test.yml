# Pytest takımı — TEK tanım.
#
# NEDEN AYRI DOSYA: bu iş daha önce ÜÇ workflow'da (ci.yml, release.yml,
# build-android.yml) birebir kopyalanmıştı. Kopyalar sessizce ayrışır: Python
# sürümünü ya da kurulum adımını birinde güncelleyip ötekini unutmak, "yayın
# yolunda kırmızıya dönen ama PR'da yeşil olan takım" demektir — release.yml'in
# kendi yorumunun uyardığı kırılma sınıfının ta kendisi.
#
# Alt çizgiyle başlıyor (`_test.yml`): bu dosya kendi başına tetiklenmez,
# yalnızca `uses:` ile çağrılır. Actions sekmesinde de o yüzden ayrı bir giriş
# gibi durmuyor.
name: Pytest

on:
  workflow_call:
    inputs:
      ref:
        description: "Denetlenecek commit (boşsa çağıranın ref'i)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Pytest takımı
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Sürüm paket işleriyle AYNI: farklı bir Python'da yeşil olan bir takım,
      # yayın yolunda kırmızıya dönebilirdi.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # PAKET VE TARAYICI TEK ADIMDA, VE YALNIZ BURADA. İkisi de bilinçli:
      #
      # `requirements-dev.txt`e KONMUYOR, çünkü `build.sh`/`build.ps1` o dosyayı
      # üç paketleme işine de kuruyor VE pytest'i koşturuyor — tarayıcı
      # indirmeden. Orada paket kurulu olunca
      # `pytest.importorskip("playwright")` atlamayı bırakıyor ve 14 E2E testi
      # `BrowserType.launch: Executable doesn't exist` ile düşüyor; 2026-09-11'de
      # tam olarak bu yaşandı, macOS paketi hiç derlenmeden kırmızıya döndü.
      # `importorskip` paketin İMPORT EDİLEBİLİRLİĞİNİ tarayıcının varlığına
      # VEKİL sayıyor — vekil ancak paket yalnız buraya kurulursa doğru.
      #
      # İkisi AYNI `run` bloğunda, çünkü ayrı adımlar ayrışabilir: birini
      # eklemek ötekini eklemeden mümkün olur ve kırılma test işinde değil
      # PAKETLEME işinde görünür. `tests/test_playwright_kurulumu.py` her iki
      # sözleşmeyi de kapıya çeviriyor.
      #
      # YALNIZ chromium: testlerin tamamı onu başlatıyor, öteki iki motoru
      # indirmek süreyi üçe katlar ve hiçbir iddiayı sınamaz. `--with-deps`
      # işletim sistemi kütüphanelerini de kuruyor; onlarsız chromium başlamıyor.
      - name: Playwright (paket + tarayıcı)
        run: |
          pip install playwright==1.63.*
          playwright install --with-deps chromium

      # `KROMIS_E2E_ZORUNLU`: E2E testleri ATLANIRSA takım kırmızıya döner.
      #
      # NEDEN: yukarıdaki adım bir gün sessizce kaybolur ya da adı değişirse
      # `pytest.importorskip("playwright")` E2E dosyalarını atlar ve bu iş yine
      # "passed" der — yani kapı yok olur ama yeşil kalır. Üstteki adımın
      # METNİNİ `tests/test_playwright_kurulumu.py` sınıyor; bu değişken de
      # adımın GERÇEKTEN iş gördüğünü sınıyor. İkisi farklı şeyler: biri
      # workflow'u okuyor, öteki koşan ortamı ölçüyor.
      #
      # Yerelde VERİLMİYOR (`tools/test_ortami.py` de vermiyor): playwright'ı
      # olmayan bir makinede takımın geri kalanı yine koşabilmeli — orada
      # doğru davranış atlamak, yanlış olan atlamanın görünmemesiydi ve onu
      # `tests/conftest.py`nin sonundaki uyarı kapatıyor.
      - name: Pytest
        env:
          KROMIS_E2E_ZORUNLU: "1"
        run: pytest tests/ -q
