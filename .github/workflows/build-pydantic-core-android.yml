# pydantic-core'un Android (arm64-v8a) wheel'ini üretir — Faz 0 / Yol A.
#
# NEDEN AYRI BİR WORKFLOW: Rust cross-compile'ı 10–20 dakika sürüyor ve Android
# SDK/NDK + Rust toolchain zinciri, Gradle zincirinden bağımsız olarak kırılıyor.
# Ayrı tutmak, hangi zincirin kırıldığını koşuya bakar bakmaz gösteriyor.
#
# ÜÇ KAYNAK, TEK ÇIKTI. Wheel şu sırayla aranıyor, ilk bulunan kazanıyor:
#   1. `android/wheels/` altına ELLE İŞLENMİŞ dosya (Yol A'nın özgün akışı,
#      bakımcının bilerek seçtiği ikili — bu yüzden önceliği var),
#   2. çivilerden kurulan anahtarla ÖNBELLEK,
#   3. yeni DERLEME.
# Kaynağı ne olursa olsun aynı doğrulama kapısından geçiyor ve aynı varlık adıyla
# yükleniyor, yani çağıran taraf farkı hiç görmüyor.
#
# NEDEN ÇAĞRILABİLİR (workflow_call): önceden wheel repoya işlenene kadar APK
# HİÇ derlenemiyordu — tek bir elle adım, telefona kurulacak paketin tamamını
# rehin alıyordu. Karar belgesindeki "her APK derlemesinde koşmasın" kaygısı
# önbellekle karşılanıyor: çivi başına bir kez derleniyor.
#
# NEDEN HİÇ OLMASI GEREKTİĞİ: pydantic-core Rust'la yazılmış tek native
# bağımlılığımız ve PyPI'de Android wheel'i YOK, Chaquopy deposunda da yok.
# Chaquopy 17 sdist kurmuyor (`--only-binary` zorunlu), yani bu wheel olmadan
# `import pydantic` cihazda hiç çalışmaz — FastAPI'nin tamamı buna bağlı.
# Gerekçenin tamamı ve reddedilen alternatif: docs/android/pydantic-karari.md
#
# DONDURULDU (2026-09-16, Faz 0 / Adım 1): bu paket v0.23.1'de dondu. Workflow
# silinmedi ama artık hiçbir push/PR ona ulaşmıyor — çağıranı `_paket-android.yml`
# (o da yalnız `release.yml`in `workflow_dispatch`inden) ve buradaki elle tetik.
# Gerekçe: docs/faz0-web-first.md.
name: pydantic-core Android wheel

on:
  # Elle: wheel'i repoya işlemek için (Yol A'nın özgün akışı).
  # push/tag üzerine KOŞMUYOR — yalnızca runner dakikası harcardı.
  workflow_dispatch:
    inputs:
      pydantic_core_version:
        description: 'pydantic-core sürümü (boş bırakılırsa android/pins.properties okunur)'
        required: false
        default: ''
      python_version:
        description: 'Chaquopy çalışma zamanı Python sürümü (boş → pins.properties)'
        required: false
        default: ''
      android_api:
        description: 'Wheel etiketindeki API seviyesi (boş → pins.properties)'
        required: false
        default: ''

  # _paket-android.yml bu workflow'u bir iş olarak çağırıyor.
  #
  # NEDEN: wheel'in repoya elle işlenmesi Yol A'nın kararıydı ve öyle KALIYOR
  # (aşağıdaki "repoda var mı" kapısı ona öncelik veriyor). Ama o dosya
  # gelmeden APK hiç derlenemiyordu — yani tek bir elle adım, telefona kurulacak
  # paketin tamamını rehin alıyordu. Çağrılabilir olmak bu kilidi açıyor:
  # wheel repoda yoksa APK işi onu kendisi üretir.
  #
  # Karar belgesindeki "her APK derlemesinde koşmasın" kaygısı geçerliliğini
  # koruyor ve aşağıdaki ÖNBELLEK ile karşılanıyor: wheel çivi başına bir kez
  # derleniyor, sonraki koşular onu saniyeler içinde geri yüklüyor.
  workflow_call:
    inputs:
      pydantic_core_version:
        type: string
        required: false
        default: ''
      python_version:
        type: string
        required: false
        default: ''
      android_api:
        type: string
        required: false
        default: ''
      varlik_yukle:
        description: "true → wheel Actions VARLIĞI olarak da yüklenir"
        type: boolean
        required: false
        default: true

    # Çağıran wheel'i ÖNBELLEKTEN alıyor, varlıktan değil. Bunun için anahtarı
    # ve kaynağı bilmesi gerekiyor — ikisini de burada üretiyoruz, yoksa çivi
    # çözme mantığı çağıranda ikinci kez yazılırdı ve ayrışırdı.
    outputs:
      anahtar:
        description: "Wheel'in önbellek anahtarı"
        value: ${{ jobs.build-wheel.outputs.anahtar }}
      kaynak:
        description: "repo | önbellek | derleme"
        value: ${{ jobs.build-wheel.outputs.kaynak }}
      ad:
        description: "Wheel dosya adı"
        value: ${{ jobs.build-wheel.outputs.ad }}

permissions:
  contents: read

jobs:
  build-wheel:
    name: pydantic-core → android_arm64_v8a
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      anahtar: ${{ steps.pin.outputs.anahtar }}
      kaynak: ${{ steps.gerek.outputs.kaynak }}
      ad: ${{ steps.pin.outputs.ad }}

    steps:
      - uses: actions/checkout@v4

      # Girdiler boşsa çivi dosyası kazanır: workflow'u elle tetikleyen kişi
      # sürümü ikinci bir yere yazmak zorunda kalmasın. pins.properties zaten
      # build.gradle'ın da okuduğu dosya, yani üretilen wheel ile onu KURACAK
      # yapılandırma tek kaynaktan besleniyor.
      - name: Çivileri çöz (girdi > pins.properties)
        id: pin
        run: |
          set -euo pipefail
          oku() { grep -E "^$1=" android/pins.properties | cut -d= -f2- | tr -d '[:space:]'; }
          CORE="${{ inputs.pydantic_core_version }}"
          PY="${{ inputs.python_version }}"
          API="${{ inputs.android_api }}"
          [ -n "$CORE" ] || CORE="$(oku pydanticCoreVersion)"
          [ -n "$PY" ]   || PY="$(oku pythonVersion)"
          [ -n "$API" ]  || API="$(oku wheelAndroidApi)"
          for d in "$CORE" "$PY" "$API"; do
            test -n "$d" || { echo "HATA: çivi çözülemedi (CORE=$CORE PY=$PY API=$API)"; exit 1; }
          done
          # cp313 gibi bir etiket: cibuildwheel'in CIBW_BUILD deseni bunu ister.
          CP="cp$(echo "$PY" | tr -d '.')"
          echo "core=$CORE"  >> "$GITHUB_OUTPUT"
          echo "python=$PY"  >> "$GITHUB_OUTPUT"
          echo "api=$API"    >> "$GITHUB_OUTPUT"
          echo "cp=$CP"      >> "$GITHUB_OUTPUT"
          echo "ad=pydantic_core-$CORE-$CP-$CP-android_${API}_arm64_v8a.whl" >> "$GITHUB_OUTPUT"
          # Önbellek anahtarı BURADA kuruluyor, geri yükleme adımının içinde
          # değil: aynı anahtarı çağıran iş de (`_paket-android.yml`) okuyor ve
          # iki yerde ayrı ayrı yazılsaydı sessizce ayrışabilirdi — wheel
          # bulunamaz, hata da Chaquopy pip çıktısının içinde kaybolurdu.
          echo "anahtar=pydantic-core-$CORE-$CP-android$API-arm64_v8a" >> "$GITHUB_OUTPUT"
          echo "pydantic-core=$CORE, python=$PY ($CP), android API=$API"

      # ── Derlemeden KAÇINMANIN iki yolu ──────────────────────────────
      # Rust cross-compile'ı 10–20 dakika sürüyor. Aşağıdaki iki kapı onu
      # gereksiz yere koşturmamak için; ikisi de boş geçilirse derlenir.

      # (1) Wheel repoya İŞLENMİŞ mi? Yol A'nın özgün akışı bu ve önceliği
      # var: repodaki dosya, bakımcının bilerek seçtiği ikilidir.
      - name: Repoda hazır wheel var mı
        id: repo
        run: |
          set -euo pipefail
          mkdir -p cikti
          W="android/wheels/${{ steps.pin.outputs.ad }}"
          if [ -s "$W" ]; then
            cp "$W" cikti/
            echo "hazir=evet" >> "$GITHUB_OUTPUT"
            echo "repodaki wheel kullanılıyor: $W"
          else
            echo "hazir=hayir" >> "$GITHUB_OUTPUT"
            echo "repoda wheel yok — önbelleğe, sonra derlemeye bakılacak."
          fi

      # (2) Önbellek. Anahtar ÇİVİLERDEN kuruluyor: pydantic-core sürümü,
      # Python etiketi ya da API seviyesi değiştiği an anahtar da değişiyor ve
      # bayat bir wheel geri yüklenemiyor — `pins.properties`'in "uyuşmazlık
      # ancak telefonda görünür" uyarısının önbellekteki karşılığı.
      - name: Önbellekten geri yükle
        id: onbellek
        if: steps.repo.outputs.hazir != 'evet'
        uses: actions/cache/restore@v4
        with:
          path: cikti
          key: ${{ steps.pin.outputs.anahtar }}

      - name: Derleme gerekiyor mu
        id: gerek
        run: |
          set -euo pipefail
          if [ "${{ steps.repo.outputs.hazir }}" = "evet" ]; then
            echo "derle=hayir" >> "$GITHUB_OUTPUT"; echo "kaynak=repo" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.onbellek.outputs.cache-hit }}" = "true" ]; then
            echo "derle=hayir" >> "$GITHUB_OUTPUT"; echo "kaynak=önbellek" >> "$GITHUB_OUTPUT"
          else
            echo "derle=evet" >> "$GITHUB_OUTPUT"; echo "kaynak=derleme" >> "$GITHUB_OUTPUT"
          fi

      # KOŞULSUZ: aşağıdaki doğrulama adımı da `python` kullanıyor ve o adım
      # wheel repodan da, önbellekten de gelse koşuyor.
      - name: Set up Python (cibuildwheel sürücüsü + doğrulama)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # NDK ŞART: pydantic-core Rust ve `aarch64-linux-android` hedefi linker
      # olarak NDK'nın clang'ını kullanıyor. `ndk-version` AÇIKÇA yazılıyor —
      # runner imajındaki varsayılan NDK bir gün değişirse sessizce başka bir
      # libc sürümüne bağlanmış bir wheel üretilirdi.
      - name: Android SDK + NDK
        if: steps.gerek.outputs.derle == 'evet'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 ndk;27.0.12077973'

      - name: NDK yolunu doğrula
        if: steps.gerek.outputs.derle == 'evet'
        id: ndk
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          test -d "$NDK" || { echo "HATA: NDK bulunamadı: $NDK"; ls -la "$ANDROID_HOME/ndk" || true; exit 1; }
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "NDK: $NDK"

      # Rust hedefi cibuildwheel'den ÖNCE ekleniyor: maturin hedefi kendisi
      # kurmuyor, yoksa derleme "target may not be installed" ile düşer.
      - name: Rust + aarch64-linux-android hedefi
        if: steps.gerek.outputs.derle == 'evet'
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android
          rustc -vV

      - name: cibuildwheel
        if: steps.gerek.outputs.derle == 'evet'
        run: python -m pip install --upgrade "cibuildwheel>=3.1"

      # Kaynak olarak sdist: pydantic-core'un git deposunu klonlamak yerine
      # PyPI'deki sdist alınıyor. Gerekçe: kurulacak sürüm ile derlenen sürüm
      # AYNI paket dosyasından gelsin — git tag'i ile PyPI yayını teoride
      # ayrışabilir ve bu ayrışma yalnız cihazda görünürdü.
      #
      # `pip download` İLE DEĞİL, PyPI'nin JSON API'siyle. İlk kurgu
      # `pip download --no-binary :all: --no-deps --no-build-isolation`
      # kullanıyordu ve koşunun ilk gerçek denemesinde şununla düştü:
      #
      #     BackendUnavailable: Cannot import 'maturin'
      #
      # Sebep: pip bir sdist'i indirirken onu yalnızca KOPYALAMIYOR, PEP 517
      # arka ucunu (pydantic-core'da maturin) çağırıp metadata üretmeye
      # çalışıyor. `--no-build-isolation` bunu kurulu OLMAYAN maturin'e
      # yönlendiriyordu. İzolasyonu açmak da doğru cevap değil: yalnızca
      # metadata için maturin + Rust kuran ikinci bir derleme ortamı doğardı
      # ve gerçek derlemeyi zaten cibuildwheel yapıyor.
      #
      # Bize gereken tek şey tarball, yani arka ucu HİÇ çalıştırmamak hem
      # doğru hem hızlı. sha256 PyPI'nin bildirdiği değerle karşılaştırılıyor:
      # bu tarball telefona giren native kodun kaynağı ve yarım inmiş bir
      # dosya ancak cihazda, açılışta görünürdü.
      - name: pydantic-core sdist'ini indir ve aç
        if: steps.gerek.outputs.derle == 'evet'
        run: |
          set -euo pipefail
          mkdir -p kaynak
          python - "${{ steps.pin.outputs.core }}" <<'PY'
          import hashlib, json, pathlib, sys, urllib.request

          surum = sys.argv[1]
          adres = f"https://pypi.org/pypi/pydantic-core/{surum}/json"
          with urllib.request.urlopen(adres, timeout=60) as yanit:
              veri = json.load(yanit)

          sdistler = [d for d in veri["urls"] if d["packagetype"] == "sdist"]
          if len(sdistler) != 1:
              sys.exit(f"HATA: tam 1 sdist bekleniyordu, {len(sdistler)} bulundu")
          s = sdistler[0]

          hedef = pathlib.Path("kaynak") / s["filename"]
          with urllib.request.urlopen(s["url"], timeout=300) as yanit:
              hedef.write_bytes(yanit.read())

          bulunan = hashlib.sha256(hedef.read_bytes()).hexdigest()
          beklenen = s["digests"]["sha256"]
          if bulunan != beklenen:
              sys.exit(f"HATA: sha256 uyuşmuyor\n  beklenen: {beklenen}\n  bulunan : {bulunan}")

          print(f"{s['filename']} ({hedef.stat().st_size} bayt), sha256 doğrulandı")
          PY

          ls -l kaynak
          tar -xzf "kaynak/pydantic_core-${{ steps.pin.outputs.core }}.tar.gz" -C kaynak
          test -d "kaynak/pydantic_core-${{ steps.pin.outputs.core }}" \
            || { echo "HATA: sdist beklenen dizine açılmadı"; ls -R kaynak | head -40; exit 1; }

      - name: Wheel'i derle (cibuildwheel, android/arm64_v8a)
        if: steps.gerek.outputs.derle == 'evet'
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: '${{ steps.pin.outputs.cp }}-*'
          CIBW_ARCHS: arm64_v8a
          # Wheel etiketindeki API seviyesi = minSdk. Daha yükseğe kurulan bir
          # wheel pip tarafından cihazda "uyumsuz" sayılırdı (bkz. pins.properties).
          ANDROID_API_LEVEL: '${{ steps.pin.outputs.api }}'
          # Android'de test koşturmak emülatör ister; bu iş yalnızca DERLİYOR.
          # Gerçek doğrulama APK işinde `import pydantic` ile yapılıyor.
          CIBW_TEST_COMMAND: ''
        run: |
          set -euo pipefail
          python -m cibuildwheel --output-dir cikti \
            "kaynak/pydantic_core-${{ steps.pin.outputs.core }}"

      # "Yeşil ama boş" kapısı — release.yml'de bu dersin bedeli ödendi:
      # yeşil bir koşu tek başına kanıt değil. Aşağıdaki her satır bir yanılgıyı
      # kapatıyor: dosya var mı, boş değil mi, ETİKETİ doğru mu, API seviyesi
      # minSdk'yı aşmıyor mu, içinde gerçekten arm64 bir .so var mı.
      - name: Wheel'i doğrula (dosya, etiket, API, .so)
        run: |
          set -euo pipefail
          CP="${{ steps.pin.outputs.cp }}"
          API="${{ steps.pin.outputs.api }}"
          shopt -s nullglob
          WHEELS=(cikti/*.whl)
          test "${#WHEELS[@]}" -eq 1 \
            || { echo "HATA: tam 1 wheel bekleniyordu, ${#WHEELS[@]} bulundu"; ls -l cikti || true; exit 1; }
          W="${WHEELS[0]}"
          test -s "$W" || { echo "HATA: wheel boş: $W"; exit 1; }
          AD="$(basename "$W")"
          echo "wheel: $AD ($(du -h "$W" | cut -f1))"

          case "$AD" in
            pydantic_core-${{ steps.pin.outputs.core }}-$CP-$CP-android_*_arm64_v8a.whl) ;;
            *) echo "HATA: beklenmeyen wheel etiketi: $AD"; exit 1 ;;
          esac

          # Etiketteki API sayısını çek ve minSdk ile karşılaştır.
          ETIKET_API="$(echo "$AD" | sed -E 's/.*-android_([0-9]+)_arm64_v8a\.whl/\1/')"
          echo "etiket API: $ETIKET_API (minSdk: $API)"
          test "$ETIKET_API" -le "$API" \
            || { echo "HATA: wheel API $ETIKET_API > minSdk $API — pip cihazda bu wheel'i kurmaz"; exit 1; }

          # Wheel gerçekten bir arm64 paylaşımlı kitaplık taşıyor mu? Etiket
          # doğru ama içi boş bir wheel de bu noktaya kadar gelirdi.
          python - "$W" <<'PY'
          import sys, zipfile
          w = zipfile.ZipFile(sys.argv[1])
          sos = [n for n in w.namelist() if n.endswith(".so")]
          if not sos:
              print("HATA: wheel içinde hiç .so yok:", w.namelist()[:20]); raise SystemExit(1)
          print("paylaşımlı kitaplıklar:", sos)
          PY

      # Önbelleğe ancak DOĞRULAMADAN GEÇTİKTEN sonra yazılıyor: bozuk bir
      # wheel önbelleğe girseydi, anahtar değişene kadar her koşu onu geri
      # yükler ve hata çivi güncellenene dek yaşardı.
      - name: Önbelleğe yaz
        if: steps.gerek.outputs.derle == 'evet'
        uses: actions/cache/save@v4
        with:
          path: cikti
          key: ${{ steps.pin.outputs.anahtar }}

      # Varlık YALNIZCA elle tetiklenen akış için yükleniyor (Yol A: bakımcı
      # wheel'i indirip `android/wheels/` altına işliyor).
      #
      # `_paket-android.yml` bu workflow'u bir iş olarak çağırdığında
      # `varlik_yukle: false` geçiyor ve wheel'i ÖNBELLEKTEN alıyor. Sebebi
      # ölçülü: 2026-08-28'de Actions varlık kotası doldu ve yayın hattı,
      # paketlerin hepsi hatasız derlenmiş olmasına rağmen teslim edilemediği
      # için günlerce kırmızı kaldı. Önbellek AYRI ve ücretsiz bir havuz (depo
      # başına 10 GB, LRU), yani bu teslim yolu kotaya hiç dokunmuyor.
      - name: Wheel'i yükle (varlık olarak)
        if: inputs.varlik_yukle
        uses: actions/upload-artifact@v4
        with:
          name: pydantic-core-android-arm64
          path: cikti/*.whl
          # release.yml'deki aynı kapı: bu bayrak olmadan eşleşen dosya
          # bulunmadığında adım yalnız UYARI basar ve iş yeşil kalır.
          if-no-files-found: error
          # SAKLAMA — burası 90'dı; paket işlerindeki aynı gerekçe (kota
          # 2026-08-28'de doldu, CI kırmızıya düştü). 1 değil 7, çünkü bu
          # varlığın koşu DIŞINDA gerçek bir tüketicisi var: Yol A'da bakımcı
          # workflow'u elle tetikleyip wheel'i indiriyor ve `android/wheels/`
          # altına işliyor. Bir hafta o akışa fazlasıyla yetiyor; kaçırılırsa
          # yeniden tetiklemenin bedeli de saniyeler, çünkü önbellek duruyor.
          retention-days: 7

      - name: Özet
        run: |
          echo "wheel kaynağı: ${{ steps.gerek.outputs.kaynak }}"
          if [ "${{ steps.gerek.outputs.derle }}" = "evet" ]; then
            echo
            echo "Bu wheel YENİ derlendi ve önbelleğe alındı; APK işi onu kendisi kullanabilir."
            echo "Kalıcı kılmak istersen (önbellek 7 gün dokunulmazsa düşer):"
            echo "  varlığı indir, android/wheels/ altına koy ve commit'le."
            echo "  android/app/build.gradle dosyayı ADIYLA kuruyor — ad değişirse pins.properties'i de güncelle."
          fi
