# Her pull request'te test takımını koşturur.
#
# NEDEN VAR: bu repodaki diğer üç workflow tag'e (`push: tags: v*`) ya da elle
# tetiklemeye bağlı. Yani bir PR'ın içeriği, TAG ATILANA kadar hiçbir kapıdan
# geçmiyordu — ve tag atıldığı an ilk gerçek koşu doğrudan yayın yolunda
# oluyordu. `build-android.yml`'nin başındaki "tag'e bağlı bir işin ilk gerçek
# koşumunu tag'le denemek geri dönüşsüz" gerekçesi tam olarak bunu anlatıyor;
# aynı gerekçe pytest takımı için de geçerli, üstelik daha ucuz.
#
# NEDEN YALNIZ PYTEST: paketleme işleri (PyInstaller, Gradle + NDK) on
# dakikalarca sürüyor ve her PR'da koşmaları runner dakikasını hızla yakardı.
# Regresyonların ezici çoğunluğunu 1200+ testlik takım zaten yakalıyor;
# paketleme kapıları tag'de ve elle tetiklemede yerinde duruyor.
name: CI

on:
  pull_request:
  # `main`'e doğrudan giden commit'ler de kapsansın: PR'dan geçmeyen bir
  # düzeltme (ya da squash sonrası main'in kendisi) sessizce test edilmemiş
  # kalmasın.
  push:
    branches:
      - main

# Aynı dala arka arkaya push yapılırsa yalnız SONUNCUSU koşsun. Eski koşuyu
# beklemek hem yavaş hem yanıltıcı: kırmızı bir sonuç artık var olmayan bir
# commit hakkında olurdu.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Pytest takımı
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Sürüm, release.yml ve build-android.yml'deki test işleriyle AYNI:
      # farklı bir Python'da yeşil olan bir takım, yayın yolunda kırmızıya
      # dönebilirdi.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Pytest
        run: pytest tests/ -q
