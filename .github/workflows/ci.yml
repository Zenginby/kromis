# Her pull request'te testleri, paketlemeye dokunan PR'larda ÜÇ PAKETİ DE koşturur.
#
# NEDEN VAR: bu depodaki paketleme işleri eskiden yalnız tag'e ya da elle
# tetiklemeye bağlıydı. Bir PR'ın içeriği TAG ATILANA kadar hiçbir kapıdan
# geçmiyordu ve tag atıldığı an ilk gerçek koşu doğrudan yayın yolunda oluyordu.
#
# NEDEN ARTIK PAKETLER DE KOŞUYOR (ve neden yalnız bazı PR'larda):
# `.spec`, `build.sh`, `build.ps1` ya da `android/` altına dokunan bir
# değişikliğin kırdığı şey testlerde HİÇ görünmüyor — yalnız paketleme
# aşamasında, dakikalarca süren bir işin sonunda görünüyor. Yayın artık main'e
# merge ile tetiklendiği için o kırılmayı merge'den SONRA öğrenmek geç kalmak
# demek. Depo public olduğundan GitHub-hosted runner dakikaları faturalanmıyor;
# workflow'lardaki eski "macOS dakikası 10x sayılıyor" gerekçesi artık geçerli
# değil. Yine de her PR'da koşmuyor: ilgisiz bir PR'ı 40 dakika bekletmenin
# kimseye faydası yok.
name: CI

on:
  pull_request:
  # `main`'e doğrudan giden commit'ler de kapsansın: PR'dan geçmeyen bir
  # düzeltme sessizce test edilmemiş kalmasın.
  push:
    branches:
      - main

# Aynı dala arka arkaya push yapılırsa yalnız SONUNCUSU koşsun. Eski koşuyu
# beklemek hem yavaş hem yanıltıcı: kırmızı bir sonuç artık var olmayan bir
# commit hakkında olurdu.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Testler
    uses: ./.github/workflows/_test.yml

  # PR paketlemeye dokunuyor mu? Cevabı tek yerde üretip üç işe dağıtıyoruz.
  kapsam:
    name: Paketleme kapsamı
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      paketle: ${{ steps.bak.outputs.paketle }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Değişen yollara bak
        id: bak
        env:
          TABAN: ${{ github.base_ref }}
          ETIKETLER: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          # Elle kaçış kapısı: paketlemeye dokunmayan ama yine de tam matris
          # istenen PR'lar için.
          if printf '%s' "$ETIKETLER" | grep -q 'tam-paket'; then
            echo "tam-paket etiketi var — üç paket de koşacak"
            echo "paketle=evet" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$TABAN"
          YOLLAR="$(git diff --name-only "origin/$TABAN...HEAD")"
          echo "--- değişen yollar ---"
          echo "$YOLLAR"

          # Paketlemenin sonucunu değiştirebilecek her şey. Liste bilinçle
          # GENİŞ: bir paketleme koşusunu gereksiz yere başlatmanın bedeli
          # bedava runner dakikası, atlamanın bedeli kırık bir yayın.
          if echo "$YOLLAR" | grep -qE '^(gpt-image-studio\.spec|build\.sh|build\.ps1|requirements\.txt|android/|\.github/workflows/|static/|bundled/|branding/)'; then
            KARAR=evet
          else
            KARAR=hayir
          fi
          echo "paketle=$KARAR" >> "$GITHUB_OUTPUT"
          echo "karar: paketle=$KARAR"

  # Üç paket de yayın yolundakiyle AYNI çağrılabilir workflow'u kullanıyor —
  # yani PR'da yeşil olan şey, yayında koşacak şeyin ta kendisi. Ayrı bir
  # "PR sürümü" olsaydı ikisi ayrışır ve bu kapı hiçbir şey kanıtlamazdı.
  paket-macos:
    name: macOS paketi
    needs: [test, kapsam]
    if: needs.kapsam.outputs.paketle == 'evet'
    uses: ./.github/workflows/_paket-macos.yml

  paket-windows:
    name: Windows paketi
    needs: [test, kapsam]
    if: needs.kapsam.outputs.paketle == 'evet'
    uses: ./.github/workflows/_paket-windows.yml

  paket-android:
    name: Android paketi
    needs: [test, kapsam]
    if: needs.kapsam.outputs.paketle == 'evet'
    uses: ./.github/workflows/_paket-android.yml
    # `imza_zorunlu` VERİLMİYOR (varsayılan false): imzalama sırlarına erişimi
    # olmayan bir çatalın PR'ı da bu kapıdan geçebilmeli. İmza zorunluluğu
    # yayın yolunda, release.yml'de duruyor.
    secrets: inherit
