# Her pull request'te ve main'e her push'ta testleri, sızıntı taramasını ve
# lint'i koşturur.
#
# PAKETLEME BURADAN ÇIKTI (2026-09-16, Faz 0 / Adım 1 — web-first zemin).
# 2026-08-28'den bu güne kadar `kapsam` işi PR'ın değiştirdiği yollara bakıp
# `.spec`/`build.*`/`android/`/`requirements*`/workflow dokunan PR'larda üç
# paketi (macOS, Windows, Android) de derletiyordu. Masaüstü ve Android
# paketleri v0.23.1'de DONDURULDU: proje web-first ilerliyor
# (docs/superpowers/specs/2026-08-10-saas-transformation-master-design.md,
# docs/faz0-web-first.md). Web tarafındaki her bağımlılık ve her workflow
# değişikliği o kapıyı ateşleyecek ve her ateşleme ~40 dakika + macOS'ta 10x
# faturalanan dakika demekti — üstelik dondurulmuş bir paket için.
#
# Paketleme SİLİNMEDİ, ELLE'ye alındı: `_paket-*.yml` çağrılabilir
# workflow'lar yerinde duruyor ve tek çağıranları artık `release.yml`
# (yalnız `workflow_dispatch`). "Paketleme hâlâ ayakta mı" sorusunun cevabı
# Actions → Yayın → Run workflow → `kuru_prova: true`. Bu değişmezi
# `tests/test_paketleme_dondurma.py` mandallıyor: push/PR ile tetiklenen
# hiçbir workflow bir paket workflow'unu çağıramaz.
#
# Eski `kapsam` kapısının gerekçesi ve kusur geçmişi (v0.9.1 sığ çekim, taban
# SHA kayması, 2026-08-28 daraltma) git geçmişinde (`tests/test_ci_paketleme_
# kapisi.py`, bu commit'ten önce) ve docs/yayin-hatti.md'de duruyor;
# paketleme otomatiğe geri dönerse önce oraya bakılmalı.
name: CI

on:
  pull_request:
  # `main`'e doğrudan giden commit'ler de kapsansın: PR'dan geçmeyen bir
  # düzeltme sessizce test edilmemiş kalmasın.
  push:
    branches:
      - main

# Aynı dala arka arkaya push yapılırsa yalnız SONUNCUSU koşsun. Eski koşuyu
# beklemek hem yavaş hem yanıltıcı: kırmızı bir sonuç artık var olmayan bir
# commit hakkında olurdu.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Testler
    uses: ./.github/workflows/_test.yml

  # Sırlar geçmişe DE sızabilir: tarama diff'i değil bütün geçmişi okuyor.
  #
  # NEDEN AYRI (ve neden her koşuda): bu depo kimlik bilgisi tutan bir
  # uygulamanın kaynağı ve testleri anahtar BİÇİMİNDE dizeler taşımak zorunda.
  # İnsan gözü diff'te `sk-proj-…` ile `sk-proj-DUMMY…` arasındaki farkı
  # kaçırır; kaçırdığında da bir sırrın commit'ten silinmesi onu GEÇMİŞTEN
  # silmez. İşin maliyeti ölçüldü: 76 commit / 3.4 MB / 405 ms — paketleme
  # kapısını daraltmayı gerektiren "private depo, dakika faturalanıyor"
  # gerekçesi bu işi kapsamıyor, çünkü tarama saniyenin yarısı sürüyor ve
  # ubuntu dakikası 1x.
  #
  # RESMİ EYLEM (gitleaks/gitleaks-action) YERİNE SABİTLENMİŞ İKİLİ: eylem
  # organizasyon hesaplarında lisans anahtarı istiyor ve kendi telemetrisini
  # taşıyor. Sürüm + sha256 çifti burada yazılı olduğu için koşan şey
  # denetlenebilir; sürüm yükseltmesi diff'te GÖRÜNÜR bir karar oluyor.
  #
  # `--redact`: gerçek bir bulguda sır koşu günlüğüne YAZILMAZ. Bulgunun
  # dosyası ve satırı zaten yazılıyor, teşhis için o yetiyor — sırrı günlüğe
  # dökmek onu ikinci bir yere sızdırmak olurdu.
  sizinti:
    name: Sızıntı taraması
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Sığ klonda geçmiş yok: tarama yalnız son commit'i görürdü.
          fetch-depth: 0

      - name: gitleaks
        env:
          SURUM: "8.28.0"
          SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${SURUM}/gitleaks_${SURUM}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          # Sıfırdan farklı çıkış = bulgu var = iş kırmızı. Muafiyetler
          # .gitleaks.toml'da tek tek yazılı; dizin bütün olarak muaf değil.
          ./gitleaks git --no-banner --redact --config .gitleaks.toml .

  # Lint + tip denetimi — Faz 0'ın ilk kapısı.
  #
  # NEDEN ŞİMDİ: `app.py` paketlere bölünecek, bağımlılıklar taşınacak ve çok
  # sayıda yeni modül gelecek; kullanılmayan ithal, tanımsız ad ve bozuk
  # `except` zinciri o hacimde gözle yakalanmaz. Kural kümesi ve her kapatılan
  # kuralın gerekçesi `pyproject.toml`da; pinler `requirements-dev.txt`te.
  #
  # `ruff format --check` BİLEREK YOK: ölçüldü, 141 dosyanın 12'si
  # biçimlendiriciyle aynı fikirde. Biçimlendirme ayrı bir PR'ın kararı.
  #
  # mypy da KAPI (Faz 0 / Adım 6, 2026-09-16): Adım 1'de `continue-on-error:
  # true` ile bilgi amaçlı koşuyordu (77 bulgu), taban sıfırlandı ve satır
  # kalktı. `tests/test_paketleme_dondurma.py` bu adımın kesici kaldığını,
  # `tests/test_mypy_kapisi.py` de `[tool.mypy]` bayraklarının gevşemediğini
  # mandallıyor.
  #
  # `requirements.txt` de kuruluyor: mypy üçüncü parti tipleri görmeden
  # `ignore_missing_imports` her şeyi `Any` sayar ve sayı yanıltıcı düşer.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy .

  # Ön yüz lint + biçim kapısı — Faz 0 / Adım 7 (2026-09-17).
  #
  # `static/` altındaki betikler modül değil, tek küresel kapsamda yükleniyor
  # (docs/graflar/onyuz.md); bu yüzden eslint her dosyaya öteki dosyaların
  # üst düzey adlarını `eslint.paylasilan-adlar.json`dan alıyor — kural ve
  # defter gerekçesi `eslint.config.js`te, bekçisi `tests/test_onyuz_lint_kapisi.py`
  # (defter tanımla/kullanımla tutarlı, kurallar gevşemez, bu iş kesici).
  #
  # `npm ci` (install DEĞİL): kilit dosyasındaki sürümleri kurar, farklıysa
  # kırmızı — CI'ın koştuğu eslint/prettier geliştiricininkiyle aynı. Node
  # majoru PİNLİ: eslint 10 `engines` alanıyla ^20.19/^22.13/>=24 istiyor,
  # pinsiz bir `setup-node` bir gün başka bir şey kurar ve kapı sebepsiz
  # kırmızıya döner. Python tarafındaki `lint` işinden AYRI iş: iki araç
  # zincirinin kurulumu birbirini beklemesin, düşen taraf adından okunsun.
  lint-onyuz:
    name: Lint (ön yüz)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: eslint
        run: npx eslint static/

      - name: prettier
        run: npx prettier --check static/

  # Konteyner imajı — Faz 0 / Adım 8 (2026-09-17).
  #
  # İmaj DERLENİR ve AÇILIR, İTİLMEZ: kayıt defteri, kimlik ve etiketleme
  # düzeni Faz 1'in dağıtım kararı. Bu işin sorusu tek: `docker build .`
  # geçiyor mu ve konteyner `/health`e 30 sn içinde 200 veriyor mu (yazılabilir
  # veri dizini ve ulaşılabilir veri tabanı dâhil — 503 olsaydı `curl -f`
  # düşerdi). `/` de soruluyor:
  # `static/`/`bundled/` bağlamdan yanlışlıkla dışlanırsa (`.dockerignore`)
  # sonda yeşil kalır ama arayüz 500 verir. Bekçisi tests/test_docker_kapisi.py
  # (iş var, derliyor, soruyor, itmiyor, kesici, zaman sınırlı).
  #
  # `trap`: sonda düşerse konteynerin günlüğü koşu günlüğüne yazılır — "30 sn
  # içinde 200 gelmedi"nin sebebi genellikle uvicorn'un ilk satırlarında.
  #
  # POSTGRES SERVİSİ (Faz 1 / 1. görev — görev listesinde 9. göreve yazılmıştı,
  # 1. görevle birlikte geldi çünkü zorunlu oldu): `/health` artık
  # `db_reachable`ı da ölçüyor ve `DATABASE_URL`siz konteyner 503 verir —
  # yani sonda DB'siz kalsaydı bu iş kırmızıya dönerdi. Sondayı 503'e alıştırmak
  # (kapıyı gevşetmek) DEĞİL, konteynere gerçek bir DB vermek seçildi: iş
  # böylece imajın SÜRÜCÜSÜNÜ de sınıyor (`psycopg-binary` tekerleği `slim`de
  # libpq'suz açılıyor mu — bkz. requirements.txt). `--network host`:
  # konteyner servisin konaktaki `localhost:5432`ine bu ağdan ulaşıyor
  # (`host.docker.internal` Linux koşucuda yok); `-p` bu kipte anlamsız,
  # uvicorn zaten konağın 8765'inde. Aynı imaj `docker compose up` ile de
  # `postgres` servisine bağlanıyor (compose.yaml).
  docker:
    name: Docker imajı
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kromis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t kromis .

      - name: /health ve /
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kromis
        run: |
          set -euo pipefail
          docker run -d --name kromis --network host -e DATABASE_URL kromis
          trap 'echo "--- konteyner günlüğü ---"; docker logs kromis 2>&1 | tail -n 50; docker rm -f kromis >/dev/null' EXIT
          for _ in $(seq 1 30); do
            if govde="$(curl -fsS localhost:8765/health)"; then
              echo "/health: $govde"
              curl -fsS -o /dev/null localhost:8765/ && echo "/: 200"
              exit 0
            fi
            sleep 1
          done
          echo "/health 30 sn içinde 200 vermedi" >&2
          exit 1
