# GEÇİCİ — publish provası. Kanıt alındıktan sonra SİLİNECEK.
#
# NEDEN VAR: `publish` işi bugüne kadar HİÇ koşmadı ve koşabilmesi için tag
# gerekiyor; yani ilk gerçek koşumu v0.3.0 tag'i olurdu. `build-windows`'un ilk
# koşusu tam bu sınıftan kırmızı çıktı (koşu 31727509717), o yüzden aynı riski
# ikinci kez almıyoruz.
#
# ÖLÇÜLEN: `download-artifact` iki paketi `dist/` içine DOĞRU ADLA indiriyor mu,
# boyut kapısı çalışıyor mu, `action-gh-release` `files:` listesindeki iki
# varlığı yayına ekliyor mu. Adımlar `release.yml`'den YAML ayrıştırıcıyla
# ÇIKARILDI (elle kopyalanmadı) — bkz. scratchpad/prova_uret.py.
#
# TEK BİLİNÇLİ SAPMA: dalda koştuğu için `tag_name` elle veriliyor ve yayın
# `draft: true`. Yani "tag adının ref'ten okunması" ölçülmüyor; ölçülen şey
# indirme → doğrulama → varlık yükleme kablolamasıdır.
#
# MALİYET: iki sahte üretici + publish provası, üçü de ubuntu (1x). macOS
# runner (10x) hiç kalkmıyor.
name: publish provasi (geçici)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sahte-macos:
    name: Sahte macOS paketi
    runs-on: ubuntu-latest
    steps:
      - name: Sahte zip üret
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 -c "import zipfile; z=zipfile.ZipFile('dist/gpt-image-studio-macOS-arm64.zip','w'); z.writestr('PROVA.txt','publish provasi - gercek paket degil'); z.close()"
          ls -l dist
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpt-image-studio-macos-arm64
          path: dist/gpt-image-studio-macOS-arm64.zip
          if-no-files-found: error

  sahte-windows:
    name: Sahte Windows paketi
    runs-on: ubuntu-latest
    steps:
      - name: Sahte zip üret
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 -c "import zipfile; z=zipfile.ZipFile('dist/gpt-image-studio-windows-x64.zip','w'); z.writestr('PROVA.txt','publish provasi - gercek paket degil'); z.close()"
          ls -l dist
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpt-image-studio-windows-x64
          path: dist/gpt-image-studio-windows-x64.zip
          if-no-files-found: error

  publish-provasi:
    needs: [sahte-macos, sahte-windows]
    name: Yayını oluştur (PROVA, draft)
    runs-on: ubuntu-latest
    steps:
      - name: macOS paketini indir
        uses: actions/download-artifact@v4
        with:
          name: gpt-image-studio-macos-arm64
          path: dist
      - name: Windows paketini indir
        uses: actions/download-artifact@v4
        with:
          name: gpt-image-studio-windows-x64
          path: dist
      - name: İki paket de indi ve boş değil
        run: |
          set -euo pipefail
          for f in dist/gpt-image-studio-macOS-arm64.zip \
                   dist/gpt-image-studio-windows-x64.zip; do
            test -s "$f" || { echo "EKSİK ya da BOŞ: $f"; exit 1; }
          done
          ls -l dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gpt-image-studio-macOS-arm64.zip
            dist/gpt-image-studio-windows-x64.zip
          tag_name: v0.0.0-prova
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
