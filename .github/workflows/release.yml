# Yayın hattı — main'e giren her değişiklik için üç paketi de üretir ve TEK
# seferde yayımlar.
#
# NE DEĞİŞTİ VE NEDEN
# -------------------
# 1) TETİK ARTIK TAG DEĞİL, main'e merge. Eskiden yayının tek yolu elle tag
#    atmaktı; tag'e bağlı bir işin ilk gerçek koşumu ise geri dönüşsüz —
#    v0.2.1'de üç başarısız/iptal koşudan sonra ancak dördüncüsü yeşil oldu ve
#    tag çoktan atılmıştı. Şimdi tag'i, HER ŞEY yeşil olduktan SONRA yayın işi
#    atıyor: kırmızı bir koşu ortada ne tag ne yayın bırakıyor.
#
# 2) YAYINI TEK İŞ YAZIYOR. v0.4.2'de yayını iki ayrı workflow yazdı:
#    build-android.yml onu 16:15:29'da APK ile oluşturup YAYIMLADI, masaüstü
#    zip'leri 16:17:04'te eklendi — arada ~95 saniye boyunca yayın sayfasında
#    yalnız APK vardı. Masaüstü işi kırmızıya düşseydi o eksik yayın öylece
#    kalırdı. Artık paket işleri yalnız varlık yüklüyor; `yayinla` işi üçünü de
#    indirip tek `action-gh-release` çağrısıyla yayını oluşturuyor.
#
# 3) SÜRÜM ELLE ARTIRILMIYOR. version.py + README + GUNCELLEME.md'yi
#    `tools/surum_yaz.py` yazıyor, kararı `tools/surum_karari.py` veriyor.
#    İkisi de saf Python ve `tests/` altında sınanıyor — yayın yolundaki bir
#    kuralı denemek için artık sürüm numarası harcamak gerekmiyor.
#
# KURU PROVA: `workflow_dispatch` + `kuru_prova: true` → karar basılır, üç paket
# de derlenir, ama sürüm commit'i atılmaz ve yayın oluşmaz. Yeni bir kapıyı
# denemenin ücretsiz yolu bu.
name: Yayın

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      surum:
        description: "Elle sürüm (ör. 0.5.0). Boşsa otomatik karar verilir."
        type: string
        required: false
        default: ""
      kuru_prova:
        description: "Paketleri üret ama yayın oluşturma"
        type: boolean
        required: false
        default: false

# Yayın yarı yolda kesilirse (sürüm commit'i atılmış, tag atılmamış) hat kendini
# bir sonraki koşuda onarıyor — ama önce o koşunun BAŞLAMASI gerekiyor. Arka
# arkaya iki merge'in aynı sürüm numarasına yazmasını engelleyen kapı bu;
# `cancel-in-progress` bilerek KAPALI: yarım kalmış bir yayın en kötü sonuç.
concurrency:
  group: yayin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Sürüm ne olacak, yayın gerekiyor mu? Bütün mantık tools/surum_karari.py'de.
  karar:
    name: Sürüm kararı
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SONSUZ DÖNGÜ KORUMASI (ikinci kat). `surum-yaz` commit mesajına
    # `[skip ci]` yazıyor ve GitHub o push'ta hiçbir workflow'u tetiklemiyor —
    # ama o davranışa tek başına güvenmiyoruz: botun kendi commit'i buraya
    # ulaşsa bile iş burada duruyor. (Üçüncü kat: `karar`ın kendisi idempotent,
    # bkz. tools/surum_karari.py'deki 1. kural.)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.author.name != 'github-actions[bot]'
    outputs:
      yayinla: ${{ steps.karar.outputs.yayinla }}
      surum: ${{ steps.karar.outputs.surum }}
      artir: ${{ steps.karar.outputs.artir }}
    steps:
      # fetch-depth: 0 ŞART — karar tag'lere bakıyor ve sığ bir klonda hiç tag
      # olmaz. Olmadığında hat "hiç tag yok" dalına düşer ve version.py'deki
      # sürümü yeniden yayınlamaya çalışırdı.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Karar ver
        id: karar
        env:
          ELLE_SURUM: ${{ inputs.surum }}
        run: python tools/surum_karari.py

  # Sürümü tek kaynağa ve ona bağlı belgelere yazar, main'e işler.
  #
  # Paket işleri BU commit'i derliyor: paketin içindeki Info.plist /
  # VERSIONINFO / versionName yeni sürümü göstermeli, yoksa paket işlerinin
  # kendi sürüm kapıları (haklı olarak) kırmızıya düşerdi.
  surum-yaz:
    name: Sürümü yaz
    needs: karar
    if: needs.karar.outputs.yayinla == 'evet'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.yaz.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Sürümü yaz ve işle
        id: yaz
        env:
          SURUM: ${{ needs.karar.outputs.surum }}
          ARTIR: ${{ needs.karar.outputs.artir }}
          KURU: ${{ inputs.kuru_prova }}
          DAL: ${{ github.ref }}
        run: |
          set -euo pipefail

          # DAL KAPISI — bu iş `git push origin HEAD:main` yapıyor.
          # `workflow_dispatch` herhangi bir daldan çalıştırılabilir; kapı
          # olmadan bir dal üzerinden (kuru prova işaretlenmeyi UNUTARAK)
          # tetiklenen tek bir koşu, o dalın içeriğini main'e iterdi. Yayın
          # yolundaki en pahalı kaza sınıfı bu: geri alması bir force-push
          # gerektirir ve o sırada yayın da çıkmış olur.
          #
          # Kapı "hata" değil "kuru provaya düş" biçiminde: daldan koşturmanın
          # meşru amacı zaten paketlemeyi denemek ve o amaç bozulmamalı.
          if [ "$DAL" != "refs/heads/main" ]; then
            echo "DAL KAPISI: koşu $DAL üzerinde — main değil."
            echo "  Sürüm commit'i atılmayacak ve yayın oluşmayacak (kuru prova)."
            {
              echo "### 🧪 Kuru prova (dal: \`$DAL\`)"
              echo
              echo "Yayın YALNIZCA \`main\` üzerinde oluşur. Bu koşu paketlemeyi"
              echo "sınıyor; sürüm commit'i atılmadı, yayın oluşmadı."
            } >> "$GITHUB_STEP_SUMMARY"
            KURU=true
          fi

          if [ "$ARTIR" != "evet" ]; then
            # Kendi kendini onarma dalı: version.py zaten bu sürümde
            # (bir önceki koşu paket aşamasında düşmüştü). Yazacak bir şey yok.
            echo "version.py zaten $SURUM — yazma adımı atlandı."
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Notlar da karar modülünden geliyor: not üretimi ile sürüm kararı
          # aynı yerde, aynı testlerin altında.
          mapfile -t NOTLAR < <(python tools/surum_karari.py --notlar)
          echo "GUNCELLEME.md'ye girecek ${#NOTLAR[@]} madde:"
          # `${NOTLAR[@]+…}`: dizi BOŞ olabilir (bütün commit'ler `chore`/`ci`
          # tipindeyse hiç not üretilmez) ve `set -u` altında boş bir dizinin
          # düz genişletilmesi eski bash'lerde hata verir. surum_yaz.py notsuz
          # çağrıyı zaten karşılıyor ("Küçük düzeltmeler ve iyileştirmeler").
          printf '  - %s\n' ${NOTLAR[@]+"${NOTLAR[@]}"}

          python tools/surum_yaz.py "$SURUM" ${NOTLAR[@]+"${NOTLAR[@]}"}

          if [ "$KURU" = "true" ]; then
            # Değişiklikler işlenmiyor, dolayısıyla paket işleri BUMP'SIZ
            # commit'i derliyor: üretilen paketler eski sürüm numarasını taşır.
            # Kuru provanın sorusu "paketleme ayakta mı", "sürüm doğru mu"
            # değil — ikincisini paket işlerinin kendi sürüm kapıları zaten
            # her koşuda kanıtlıyor.
            echo "KURU PROVA: değişiklikler işlenmiyor; paketler $GITHUB_SHA ile derlenecek."
            git --no-pager diff --stat
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.py README.md GUNCELLEME.md
          # `[skip ci]`: bu push kendi kendini yeniden tetiklemesin (birinci kat
          # koruma; ikincisi `karar` işindeki yazar kapısı).
          git commit -m "chore(surum): v$SURUM [skip ci]"

          # Push BAŞARILI olmak ZORUNDA. Denemeler tükendiğinde iş kırmızıya
          # düşmeli: yayın işi bu SHA'yı `target_commitish` olarak kullanıyor ve
          # uzakta olmayan bir commit'e tag atılamaz. Döngü sessizce bitip
          # devam etseydi hata çok daha ileride, anlaşılmaz bir biçimde çıkardı.
          BASARILI=hayir
          for deneme in 1 2 3 4; do
            if git push origin HEAD:main; then BASARILI=evet; break; fi
            echo "push başarısız (deneme $deneme) — bekleniyor"
            sleep $((2 ** deneme))
          done
          if [ "$BASARILI" != "evet" ]; then
            echo "HATA: sürüm commit'i main'e gönderilemedi."
            echo "  main korumaya alınmış olabilir; o durumda GITHUB_TOKEN'ın"
            echo "  doğrudan push'u reddedilir (docs/yayin-hatti.md)."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Hızlı kapı: paket işleri (macOS ~25 dk, Android ~40 dk) başlamadan önce
  # takım Linux'ta ~3 dakikada koşuyor. build.sh/build.ps1 testi zaten kendi
  # içlerinde koşturuyor; buradaki kazanç erken kırmızı.
  test:
    name: Testler
    needs: surum-yaz
    uses: ./.github/workflows/_test.yml
    with:
      ref: ${{ needs.surum-yaz.outputs.sha }}

  paket-macos:
    name: macOS paketi
    needs: [surum-yaz, test]
    uses: ./.github/workflows/_paket-macos.yml
    with:
      ref: ${{ needs.surum-yaz.outputs.sha }}

  paket-windows:
    name: Windows paketi
    needs: [surum-yaz, test]
    uses: ./.github/workflows/_paket-windows.yml
    with:
      ref: ${{ needs.surum-yaz.outputs.sha }}

  paket-android:
    name: Android paketi
    needs: [surum-yaz, test]
    uses: ./.github/workflows/_paket-android.yml
    with:
      ref: ${{ needs.surum-yaz.outputs.sha }}
      # Yayın yolundayız: imzasız APK geçmesin. Kuru provada gevşiyor ki
      # imzalama sırlarına erişimi olmayan bir çatal da provayı koşabilsin.
      imza_zorunlu: ${{ inputs.kuru_prova != true }}
    # ŞART: reusable workflow sırları kendiliğinden devralmaz. Bu satır
    # olmadan keystore çözülemez ve yukarıdaki kapı işi kırmızıya düşürür.
    secrets: inherit

  # TEK YAZICI. Yayın burada, hepsi yeşil olduktan sonra, tek çağrıyla doğuyor.
  yayinla:
    name: Yayını oluştur
    # `needs` listesi release_manifest.py ile BİREBİR olmak zorunda; bunu
    # tests/test_release_manifest.py her PR'da denetliyor. Bir paket işini
    # buradan düşürmek, o paketsiz bir yayın demek olurdu.
    needs: [karar, surum-yaz, paket-macos, paket-windows, paket-android]
    # `github.ref == 'refs/heads/main'` — dal kapısının ikinci yarısı ve asıl
    # olanı. `surum-yaz` daldan koşulduğunda kuru provaya düşüyor (orada
    # gerekçesi yazılı), ama yayın oluşturmayı ENGELLEYEN şey bu satır: yoksa
    # bir daldan tetiklenen koşu, o dalın paketleriyle gerçek bir yayın
    # yayımlayabilirdi. tests/test_release_manifest.py bu kapıyı denetliyor.
    if: >-
      needs.karar.outputs.yayinla == 'evet'
      && inputs.kuru_prova != true
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # release_manifest.py için: küme denetimi onu okuyor.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.surum-yaz.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Üç varlık tek dizine. `merge-multiple` olmadan her artifact kendi alt
      # dizinine iniyor ve aşağıdaki küme denetimi hiçbir şey bulamazdı.
      - name: Paketleri indir
        uses: actions/download-artifact@v4
        with:
          pattern: lumeo-*
          merge-multiple: true
          path: dist

      # EKSİKSİZLİK KAPISI — bu hattın asıl vaadi burada mandallanıyor.
      # download-artifact eksik varlıkta zaten hata verir, ama bu adım başka bir
      # şey iddia ediyor: yayına giden küme, manifestin TAM KENDİSİ. Sessizce
      # atlanmış bir iş, yanlış adla yüklenmiş bir varlık ve bayatlamış bir
      # manifest — üçü de buradan geçemiyor. Boyut denetimi ayrıca 0 baytlık bir
      # "indi" durumunu eliyor.
      - name: Yayına giden küme manifestle birebir mi
        run: |
          set -euo pipefail
          ls -l dist
          python - <<'PY'
          import os, sys
          import release_manifest as m

          bulunan = sorted(
              f for f in os.listdir("dist")
              if os.path.isfile(os.path.join("dist", f))
          )
          eksik, fazla = m.eksikler(bulunan)
          if eksik:
              print(f"HATA: yayına girmesi gereken paket YOK: {', '.join(eksik)}")
              print("  İlgili paket işinin kaydına bak — varlığı o yüklüyor.")
          if fazla:
              print(f"HATA: yayına beklenmeyen dosya geliyor: {', '.join(fazla)}")
              print("  release_manifest.py bayatlamış olabilir.")
          bos = [f for f in bulunan if os.path.getsize(os.path.join("dist", f)) == 0]
          if bos:
              print(f"HATA: 0 baytlık paket: {', '.join(bos)}")
          if eksik or fazla or bos:
              sys.exit(1)
          for f in bulunan:
              mb = os.path.getsize(os.path.join("dist", f)) / 1024 / 1024
              print(f"  {f}  ({mb:.1f} MB)")
          print(f"küme manifestle birebir: {len(bulunan)} paket")
          PY

      # Tag da yayın da BURADA doğuyor. Bir üstteki kapı geçilmeden buraya
      # gelinmiyor, yani "eksik yayın" diye bir ara durum yok.
      #
      # `files: dist/*` güvenli: bir önceki adım dist/ içeriğinin manifestle
      # KÜME OLARAK eşit olduğunu kanıtladı, yani buraya fazladan bir dosya
      # sızamaz. Glob olması dördüncü bir platform eklendiğinde bu satırın
      # güncellenmesi gerekmediği anlamına da geliyor.
      - name: Yayını oluştur (tag + üç paket, tek çağrı)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.karar.outputs.surum }}
          target_commitish: ${{ needs.surum-yaz.outputs.sha }}
          name: v${{ needs.karar.outputs.surum }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
