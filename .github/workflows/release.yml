name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run Pytest
        run: |
          pytest tests/ -v

  build:
    needs: test
    name: Build Packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            artifact_name: GPT-Image-Studio-macOS-arm64
            asset_name: gpt-image-studio-macOS-arm64.dmg
          - os: macos-13
            artifact_name: GPT-Image-Studio-macOS-x86_64
            asset_name: gpt-image-studio-macOS-x86_64.dmg
          - os: windows-latest
            artifact_name: GPT-Image-Studio-Windows-x64
            asset_name: gpt-image-studio-Windows-x64.exe

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Desktop Application
        run: |
          ./build.sh || pyinstaller gpt-image-studio.spec --noconfirm
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  release:
    needs: build
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            */*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
