# Yayın hattı — ELLE tetiklenir; üç paketi de üretir ve TEK seferde yayımlar.
#
# DURUM (2026-09-16): masaüstü ve Android paketleri v0.23.1'de dondu; aşağıdaki
# "main'e merge" anlatımı hattın KURULDUĞU günü kaydediyor, bugün tetik yalnız
# `workflow_dispatch` (gerekçe `on:` bloğunda). Hattın iç yapısı — karar,
# sürüm yazma, taslak, üç paket, tek yazıcı — bilerek DEĞİŞTİRİLMEDİ: elle
# çalıştırıldığında eskisi gibi çalışır ve `tests/test_release_manifest.py`
# onu aynı sertlikte mandallamaya devam ediyor.
#
# NE DEĞİŞTİ VE NEDEN
# -------------------
# 1) TETİK ARTIK TAG DEĞİL, main'e merge. Eskiden yayının tek yolu elle tag
#    atmaktı; tag'e bağlı bir işin ilk gerçek koşumu ise geri dönüşsüz —
#    v0.2.1'de üç başarısız/iptal koşudan sonra ancak dördüncüsü yeşil oldu ve
#    tag çoktan atılmıştı. Şimdi tag'i, HER ŞEY yeşil olduktan SONRA yayın işi
#    atıyor: kırmızı bir koşu ortada ne tag ne yayın bırakıyor.
#
# 2) YAYINI TEK İŞ YAZIYOR. v0.4.2'de yayını iki ayrı workflow yazdı:
#    build-android.yml onu 16:15:29'da APK ile oluşturup YAYIMLADI, masaüstü
#    zip'leri 16:17:04'te eklendi — arada ~95 saniye boyunca yayın sayfasında
#    yalnız APK vardı. Masaüstü işi kırmızıya düşseydi o eksik yayın öylece
#    kalırdı. Artık paket işleri yalnız varlık yüklüyor; `yayinla` işi üçünü de
#    indirip tek `action-gh-release` çağrısıyla yayını oluşturuyor.
#
# 3) SÜRÜM ELLE ARTIRILMIYOR. version.py + README + GUNCELLEME.md'yi
#    `tools/surum_yaz.py` yazıyor, kararı `tools/surum_karari.py` veriyor.
#    İkisi de saf Python ve `tests/` altında sınanıyor — yayın yolundaki bir
#    kuralı denemek için artık sürüm numarası harcamak gerekmiyor.
#
# KURU PROVA: `workflow_dispatch` + `kuru_prova: true` → karar basılır, üç paket
# de derlenir, ama sürüm commit'i atılmaz ve yayın oluşmaz. Yeni bir kapıyı
# denemenin ücretsiz yolu bu.
name: Yayın

on:
  # YALNIZ ELLE (2026-09-16, Faz 0 / Adım 1). `push: branches: [main]` tetiği
  # kaldırıldı: masaüstü ve Android paketleri v0.23.1'de donduruldu, proje
  # web-first ilerliyor (docs/faz0-web-first.md). main'e merge artık sürüm
  # artırmaz, paket derlemez, yayın çıkarmaz. Hattın geri kalanı olduğu gibi
  # duruyor — bir gün yeni bir masaüstü/Android sürümü gerekirse Actions →
  # Yayın → Run workflow yeter; `kuru_prova: true` ile de yalnız "paketleme
  # ayakta mı" sorusu cevaplanır. `tests/test_paketleme_dondurma.py` bu
  # tetiğin geri gelmemesini mandallıyor.
  workflow_dispatch:
    inputs:
      surum:
        description: "Elle sürüm (ör. 0.5.0). Boşsa otomatik karar verilir."
        type: string
        required: false
        default: ""
      kuru_prova:
        description: "Paketleri üret ama yayın oluşturma"
        type: boolean
        required: false
        default: false

# Yayın yarı yolda kesilirse (sürüm commit'i atılmış, tag atılmamış) hat kendini
# bir sonraki koşuda onarıyor — ama önce o koşunun BAŞLAMASI gerekiyor. Arka
# arkaya iki merge'in aynı sürüm numarasına yazmasını engelleyen kapı bu;
# `cancel-in-progress` bilerek KAPALI: yarım kalmış bir yayın en kötü sonuç.
concurrency:
  group: yayin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Sürüm ne olacak, yayın gerekiyor mu? Bütün mantık tools/surum_karari.py'de.
  karar:
    name: Sürüm kararı
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SONSUZ DÖNGÜ KORUMASI (ikinci kat). `surum-yaz` commit mesajına
    # `[skip ci]` yazıyor ve GitHub o push'ta hiçbir workflow'u tetiklemiyor —
    # ama o davranışa tek başına güvenmiyoruz: botun kendi commit'i buraya
    # ulaşsa bile iş burada duruyor. (Üçüncü kat: `karar`ın kendisi idempotent,
    # bkz. tools/surum_karari.py'deki 1. kural.)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.author.name != 'github-actions[bot]'
    outputs:
      yayinla: ${{ steps.karar.outputs.yayinla }}
      surum: ${{ steps.karar.outputs.surum }}
      artir: ${{ steps.karar.outputs.artir }}
    steps:
      # fetch-depth: 0 ŞART — karar tag'lere bakıyor ve sığ bir klonda hiç tag
      # olmaz. Olmadığında hat "hiç tag yok" dalına düşer ve version.py'deki
      # sürümü yeniden yayınlamaya çalışırdı.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Karar ver
        id: karar
        env:
          ELLE_SURUM: ${{ inputs.surum }}
        run: python tools/surum_karari.py

  # Sürümü tek kaynağa ve ona bağlı belgelere yazar, main'e işler.
  #
  # Paket işleri BU commit'i derliyor: paketin içindeki Info.plist /
  # VERSIONINFO / versionName yeni sürümü göstermeli, yoksa paket işlerinin
  # kendi sürüm kapıları (haklı olarak) kırmızıya düşerdi.
  surum-yaz:
    name: Sürümü yaz
    needs: karar
    if: needs.karar.outputs.yayinla == 'evet'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.yaz.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Sürümü yaz ve işle
        id: yaz
        env:
          SURUM: ${{ needs.karar.outputs.surum }}
          ARTIR: ${{ needs.karar.outputs.artir }}
          KURU: ${{ inputs.kuru_prova }}
          DAL: ${{ github.ref }}
        run: |
          set -euo pipefail

          # DAL KAPISI — bu iş `git push origin HEAD:main` yapıyor.
          # `workflow_dispatch` herhangi bir daldan çalıştırılabilir; kapı
          # olmadan bir dal üzerinden (kuru prova işaretlenmeyi UNUTARAK)
          # tetiklenen tek bir koşu, o dalın içeriğini main'e iterdi. Yayın
          # yolundaki en pahalı kaza sınıfı bu: geri alması bir force-push
          # gerektirir ve o sırada yayın da çıkmış olur.
          #
          # Kapı "hata" değil "kuru provaya düş" biçiminde: daldan koşturmanın
          # meşru amacı zaten paketlemeyi denemek ve o amaç bozulmamalı.
          if [ "$DAL" != "refs/heads/main" ]; then
            echo "DAL KAPISI: koşu $DAL üzerinde — main değil."
            echo "  Sürüm commit'i atılmayacak ve yayın oluşmayacak (kuru prova)."
            {
              echo "### 🧪 Kuru prova (dal: \`$DAL\`)"
              echo
              echo "Yayın YALNIZCA \`main\` üzerinde oluşur. Bu koşu paketlemeyi"
              echo "sınıyor; sürüm commit'i atılmadı, yayın oluşmadı."
            } >> "$GITHUB_STEP_SUMMARY"
            KURU=true
          fi

          if [ "$ARTIR" != "evet" ]; then
            # Kendi kendini onarma dalı: version.py zaten bu sürümde
            # (bir önceki koşu paket aşamasında düşmüştü). Yazacak bir şey yok.
            echo "version.py zaten $SURUM — yazma adımı atlandı."
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Notlar da karar modülünden geliyor: not üretimi ile sürüm kararı
          # aynı yerde, aynı testlerin altında.
          mapfile -t NOTLAR < <(python tools/surum_karari.py --notlar)
          echo "GUNCELLEME.md'ye girecek ${#NOTLAR[@]} madde:"
          # `${NOTLAR[@]+…}`: dizi BOŞ olabilir (bütün commit'ler `chore`/`ci`
          # tipindeyse hiç not üretilmez) ve `set -u` altında boş bir dizinin
          # düz genişletilmesi eski bash'lerde hata verir. surum_yaz.py notsuz
          # çağrıyı zaten karşılıyor ("Küçük düzeltmeler ve iyileştirmeler").
          printf '  - %s\n' ${NOTLAR[@]+"${NOTLAR[@]}"}

          python tools/surum_yaz.py "$SURUM" ${NOTLAR[@]+"${NOTLAR[@]}"}

          if [ "$KURU" = "true" ]; then
            # Değişiklikler işlenmiyor, dolayısıyla paket işleri BUMP'SIZ
            # commit'i derliyor: üretilen paketler eski sürüm numarasını taşır.
            # Kuru provanın sorusu "paketleme ayakta mı", "sürüm doğru mu"
            # değil — ikincisini paket işlerinin kendi sürüm kapıları zaten
            # her koşuda kanıtlıyor.
            echo "KURU PROVA: değişiklikler işlenmiyor; paketler $GITHUB_SHA ile derlenecek."
            git --no-pager diff --stat
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # README.en.md LİSTEDE OLMAK ZORUNDA. `surum_yaz.py` onu zaten
          # yazıyor (SURUM_DOSYALARI) ama buraya eklenmediği için yazdığı şey
          # her koşuda sahnelenmeden ATILIYORDU: v0.19.0 yayımlandığında
          # İngilizce sayfanın rozeti v0.18.0'da kalmıştı ve hiçbir test bunu
          # görmüyordu — `test_version.py`'nin kaçak literal iddiası yalnız
          # README.md'yi okuyor. Bekçisi artık var:
          # tests/test_surum_yaz.py → test_surum_yazicisinin_yazdigi_her_dosya_sahneleniyor
          git add version.py README.md README.en.md GUNCELLEME.md
          # `[skip ci]`: bu push kendi kendini yeniden tetiklemesin (birinci kat
          # koruma; ikincisi `karar` işindeki yazar kapısı).
          git commit -m "chore(surum): v$SURUM [skip ci]"

          # Push BAŞARILI olmak ZORUNDA. Denemeler tükendiğinde iş kırmızıya
          # düşmeli: yayın işi bu SHA'yı `target_commitish` olarak kullanıyor ve
          # uzakta olmayan bir commit'e tag atılamaz. Döngü sessizce bitip
          # devam etseydi hata çok daha ileride, anlaşılmaz bir biçimde çıkardı.
          BASARILI=hayir
          for deneme in 1 2 3 4; do
            if git push origin HEAD:main; then BASARILI=evet; break; fi
            echo "push başarısız (deneme $deneme) — bekleniyor"
            sleep $((2 ** deneme))
          done
          if [ "$BASARILI" != "evet" ]; then
            echo "HATA: sürüm commit'i main'e gönderilemedi."
            echo "  main korumaya alınmış olabilir; o durumda GITHUB_TOKEN'ın"
            echo "  doğrudan push'u reddedilir (docs/yayin-hatti.md)."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Hızlı kapı: paket işleri (macOS ~25 dk, Android ~40 dk) başlamadan önce
  # takım Linux'ta ~3 dakikada koşuyor. build.sh/build.ps1 testi zaten kendi
  # içlerinde koşturuyor; buradaki kazanç erken kırmızı.
  test:
    name: Testler
    needs: surum-yaz
    uses: ./.github/workflows/_test.yml
    with:
      ref: ${{ needs.surum-yaz.outputs.sha }}

  # TASLAK YAYIN — paketlerin doğrudan yazacağı yer.
  #
  # NEDEN VAR. Paketler eskiden Actions VARLIĞI olarak yükleniyor, `yayinla`
  # onları indirip yayına asıyordu. 2026-08-28'de o ara kopya hattı kırdı:
  # Actions varlık kotası doldu, üç paket de hatasız derlenip doğrulandığı hâlde
  # teslim edilemedi ve yayın çıkmadı — kota boşaltıldıktan sonra bile sayaç
  # saatlerce dolu kaldı. Yayın varlıkları (Releases altındakiler) o kotaya
  # GİRMİYOR; kırılgan olan tek şey aradaki kopyaydı.
  #
  # TASLAK, "tek yazıcı" güvencesini KORUYOR. v0.4.2'de bedeli ödenen sınıf
  # (yayın 16:15:29'da APK ile yayımlandı, masaüstü zip'leri 16:17:04'te
  # eklendi; arada ~95 saniye eksik bir yayın canlıydı) buraya ulaşamaz: taslak
  # kullanıcıya görünmüyor ve tag'i bile yok. Tag de yayın da aşağıdaki tek
  # `--draft=false` çağrısında, üç paket yerine oturduktan SONRA doğuyor.
  taslak:
    name: Taslak yayın
    needs: [karar, surum-yaz]
    if: needs.karar.outputs.yayinla == 'evet'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.ac.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.surum-yaz.outputs.sha }}

      - name: Taslağı aç
        id: ac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SURUM: ${{ needs.karar.outputs.surum }}
          SHA: ${{ needs.surum-yaz.outputs.sha }}
          KURU: ${{ inputs.kuru_prova }}
          DAL: ${{ github.ref }}
        run: |
          set -euo pipefail

          # KURU PROVA / DAL KAPISI: taslak açılmıyor ve `tag` BOŞ kalıyor.
          # Paket işleri boş `taslak` girdisiyle yükleme adımını atlıyor, yani
          # prova tam olarak eskisi gibi çalışıyor: derle, doğrula, hiçbir yere
          # yazma. Kapı burada da "hata" değil "yazma" biçiminde — daldan
          # koşturmanın meşru amacı paketlemeyi denemek.
          if [ "$KURU" = "true" ] || [ "$DAL" != "refs/heads/main" ]; then
            echo "kuru prova / dal koşusu — taslak açılmıyor, paketler hiçbir yere yazmayacak"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="v$SURUM"

          # Yarım kalmış bir koşunun taslağı YENİDEN KULLANILIYOR: hattın
          # kendi kendini onarma kuralı (tools/surum_karari.py, 1. kural) aynı
          # sürümü yeniden yayınlamayı bekliyor ve ikinci bir `create` çağrısı
          # onu ikinci bir hatayla kesecekti.
          if DURUM="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)"; then
            # YAYIMLANMIŞ bir sürümün üstüne yazmak, kullanıcının indirdiği
            # ikiliyi sessizce değiştirmek olurdu.
            test "$DURUM" = "true" || {
              echo "HATA: $TAG zaten YAYIMLANMIŞ — üzerine yazılmaz."
              echo "  Sürüm kararı bunu üretmemeliydi (tools/surum_karari.py)."
              exit 1
            }
            echo "önceki yarım koşudan kalan taslak yeniden kullanılıyor: $TAG"
          else
            gh release create "$TAG" --draft --target "$SHA" \
              --title "$TAG" --generate-notes
            echo "taslak açıldı: $TAG ($SHA)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Üç paket de PR'daki kapıyla AYNI çağrılabilir workflow — yani PR'da yeşil
  # olan şey, yayında koşacak şeyin ta kendisi. Aralarındaki TEK fark `taslak`
  # girdisi: PR'da boş (hiçbir yere yazılmaz), burada dolu.
  paket-macos:
    name: macOS paketi
    needs: [surum-yaz, test, taslak]
    uses: ./.github/workflows/_paket-macos.yml
    with:
      ref: ${{ needs.surum-yaz.outputs.sha }}
      taslak: ${{ needs.taslak.outputs.tag }}

  paket-windows:
    name: Windows paketi
    needs: [surum-yaz, test, taslak]
    uses: ./.github/workflows/_paket-windows.yml
    with:
      ref: ${{ needs.surum-yaz.outputs.sha }}
      taslak: ${{ needs.taslak.outputs.tag }}

  paket-android:
    name: Android paketi
    needs: [surum-yaz, test, taslak]
    uses: ./.github/workflows/_paket-android.yml
    with:
      ref: ${{ needs.surum-yaz.outputs.sha }}
      taslak: ${{ needs.taslak.outputs.tag }}
      # Yayın yolundayız: imzasız APK geçmesin. Kuru provada gevşiyor ki
      # imzalama sırlarına erişimi olmayan bir çatal da provayı koşabilsin.
      imza_zorunlu: ${{ inputs.kuru_prova != true }}
    # ŞART: reusable workflow sırları kendiliğinden devralmaz. Bu satır
    # olmadan keystore çözülemez ve yukarıdaki kapı işi kırmızıya düşürür.
    secrets: inherit

  # TEK YAZICI. Yayın burada, hepsi yeşil olduktan sonra, tek çağrıyla doğuyor.
  yayinla:
    name: Yayını oluştur
    # `needs` listesi release_manifest.py ile BİREBİR olmak zorunda; bunu
    # tests/test_release_manifest.py her PR'da denetliyor. Bir paket işini
    # buradan düşürmek, o paketsiz bir yayın demek olurdu.
    needs: [karar, surum-yaz, taslak, paket-macos, paket-windows, paket-android]
    # `github.ref == 'refs/heads/main'` — dal kapısının ikinci yarısı ve asıl
    # olanı. `surum-yaz` daldan koşulduğunda kuru provaya düşüyor (orada
    # gerekçesi yazılı), ama yayın oluşturmayı ENGELLEYEN şey bu satır: yoksa
    # bir daldan tetiklenen koşu, o dalın paketleriyle gerçek bir yayın
    # yayımlayabilirdi. tests/test_release_manifest.py bu kapıyı denetliyor.
    if: >-
      needs.karar.outputs.yayinla == 'evet'
      && inputs.kuru_prova != true
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # release_manifest.py için: küme denetimi onu okuyor.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.surum-yaz.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # EKSİKSİZLİK KAPISI — bu hattın asıl vaadi burada mandallanıyor.
      # Kapının sorusu değişmedi, yalnız baktığı yer değişti: paketler artık
      # indirilmiyor, taslağın İÇİNDE duruyorlar. Sessizce atlanmış bir iş,
      # yanlış adla yüklenmiş bir varlık ve bayatlamış bir manifest — üçü de
      # buradan geçemiyor. Boyut denetimi ayrıca 0 baytlık bir varlığı eliyor.
      - name: Taslağa giren küme manifestle birebir mi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.taslak.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$TAG" || { echo "HATA: taslak tag'i boş — taslak işine bak."; exit 1; }
          gh release view "$TAG" --json assets \
            -q '.assets[] | "\(.name)\t\(.size)"' > varliklar.tsv
          echo "--- taslaktaki varlıklar ---"; cat varliklar.tsv
          python - <<'PY'
          import sys
          import release_manifest as m

          bulunan, boyut = [], {}
          with open("varliklar.tsv", encoding="utf-8") as f:
              for satir in f:
                  satir = satir.rstrip("\n")
                  if not satir:
                      continue
                  ad, _, bayt = satir.partition("\t")
                  bulunan.append(ad)
                  boyut[ad] = int(bayt)

          eksik, fazla = m.eksikler(bulunan)
          if eksik:
              print(f"HATA: yayına girmesi gereken paket YOK: {', '.join(eksik)}")
              print("  İlgili paket işinin kaydına bak — taslağa onu o yüklüyor.")
          if fazla:
              print(f"HATA: yayına beklenmeyen dosya geliyor: {', '.join(fazla)}")
              print("  release_manifest.py bayatlamış ya da taslakta artık var olabilir.")
          bos = [a for a in bulunan if boyut[a] == 0]
          if bos:
              print(f"HATA: 0 baytlık paket: {', '.join(bos)}")
          if eksik or fazla or bos:
              sys.exit(1)
          for a in sorted(bulunan):
              print(f"  {a}  ({boyut[a] / 1024 / 1024:.1f} MB)")
          print(f"küme manifestle birebir: {len(bulunan)} paket")
          PY

      # Tag da yayın da BURADA doğuyor. Bir üstteki kapı geçilmeden buraya
      # gelinmiyor, yani "eksik yayın" diye bir ara durum yok. Taslak
      # yayımlanana kadar tag de yok: `--draft=false` onu `--target`taki
      # commit'e oluşturuyor.
      # PAKET DOĞRULAMA — kullanıcının elindeki dosya GERÇEKTEN bu hattan mı
      # çıktı?
      #
      # NEDEN VAR: uygulama public ve paketler imzasız (macOS'ta noter onayı,
      # Windows'ta Authenticode yok — KURULUM.md Gatekeeper/SmartScreen
      # adımlarını bu yüzden anlatıyor). İmzasız bir paket için "bu dosya
      # bozulmamış ve benden geldi" diyebilmenin kalan tek yolu özet: biri
      # `kromis-windows-x64.zip` adıyla içine bir şey koyduğu bir kopyayı
      # başka bir yerde dağıtırsa, kullanıcı burada YAYIMLANMIŞ özetle
      # karşılaştırıp anlayabilir. Özet yayının İÇİNDE durduğu için de
      # kopyalanamaz: sahte paketi dağıtan kişi bu sayfayı değiştiremez.
      #
      # KAPIDAN SONRA: özet ancak "üç paket de yerinde" kanıtlandıktan sonra
      # anlamlı. Sıra tersine dönerse eksik bir kümenin özeti üretilirdi.
      #
      # Dosya adları manifestten okunuyor, `*` ile DEĞİL: hem çıktı sırası
      # kararlı oluyor hem de bir paket eksikse `sha256sum` kırmızıya düşüyor.
      - name: Paketlerin SHA-256 özetini üret ve yayına ekle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.taslak.outputs.tag }}
        run: |
          set -euo pipefail
          ADLAR="$(python -c 'import release_manifest as m; print(" ".join(sorted(m.varliklar())))')"

          mkdir -p ozet
          gh release download "$TAG" --dir ozet --clobber
          # Önceki yarım koşudan kalmış olabilir: kendi çıktısını özetlemesin.
          rm -f ozet/SHA256SUMS.txt
          ( cd ozet && sha256sum $ADLAR > SHA256SUMS.txt )
          cat ozet/SHA256SUMS.txt

          # `--clobber`: yarım kalmış bir koşunun yeniden koşulması hattın
          # normal davranışı (taslak yeniden kullanılıyor), ikinci yükleme
          # hata vermemeli.
          gh release upload "$TAG" ozet/SHA256SUMS.txt --clobber

          # Notlara doğrulama bölümü — özetin kullanıcıya GÖRÜNDÜĞÜ yer.
          # `--generate-notes` gövdesi korunuyor: üzerine yazmak sürüm
          # notlarını silerdi.
          IMZA="## 🔐 Paket doğrulama"
          GOVDE="$(gh release view "$TAG" --json body -q .body)"
          if printf '%s' "$GOVDE" | grep -qF "$IMZA"; then
            echo "doğrulama bölümü zaten var (yeniden koşu) — notlara dokunulmadı"
            exit 0
          fi
          {
            printf '%s\n\n' "$GOVDE"
            printf '%s\n\n' "$IMZA"
            printf 'Resmî paketler YALNIZCA bu depodan dağıtılır. İndirdiğin dosyanın\n'
            printf 'bu hattan çıktığını doğrulamak için:\n\n'
            printf '```sh\n'
            printf '# macOS / Linux\nshasum -a 256 kromis-macOS-arm64.zip\n\n'
            printf '# Windows (PowerShell)\nGet-FileHash .\\kromis-windows-x64.zip -Algorithm SHA256\n'
            printf '```\n\n'
            printf 'Beklenen değerler (`SHA256SUMS.txt` olarak da ekli):\n\n'
            printf '```\n'
            cat ozet/SHA256SUMS.txt
            printf '```\n\n'
            printf 'Özet tutmuyorsa dosya bu yayından gelmiyor demektir — kurma.\n'
            printf 'Lisans: GNU AGPL-3.0. "Kromis" adı ve logosu lisansın kapsamı\n'
            printf 'dışındadır (MARKA.md).\n'
          } > notlar.md
          gh release edit "$TAG" --notes-file notlar.md
          echo "doğrulama bölümü yayın notlarına eklendi"

      - name: Taslağı yayımla (tag + üç paket, tek anda)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.taslak.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          echo "yayımlandı: $TAG"
