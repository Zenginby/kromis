# FSL-1.1-ALv2. Kaynak: https://github.com/Zenginby/kromis
#
# BU DOSYA ASCII: Alembic onu KENDI okuyor ve `encoding="locale"` veriyor
# (alembic/config.py), yani Turkce Windows'ta cp1254. Tek bir ASCII disi bayt
# butun goc yolunu `UnicodeDecodeError` ile dusuruyor ve `depo_db` uzerinden
# DB'ye dokunan HER test kirmizi oluyor (olculdu 2026-09-18: 1024 hata; CI'in
# yereli UTF-8 oldugu icin orada hic gorunmedi). Bekcisi
# tests/test_db.py::test_alembic_ini_is_ascii_only.
#
# Bu yuzden gerekcelerin TURKCE anlatimi burada DEGIL, `alembic/env.py`nin
# docstring'inde (o dosyayi biz utf-8 ile okuyoruz). Telif bildiriminin tam
# hali de orada.

[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
