#
# Alembic yapılandırması (Faz 1 / 1. görev). `sqlalchemy.url` BURADA YOK ve
# bilerek: bağlantı dizesi tek kaynaktan, `DATABASE_URL` ortam değişkeninden
# okunuyor (`services/db.py` → `alembic/env.py`). Dosyaya yazılmış bir URL ya
# bayat kalır ya bir parola taşır; ikisi de bu depoda ölçülmüş kusur sınıfı.
#
#   DATABASE_URL=postgresql+psycopg://… alembic upgrade head
#   DATABASE_URL=… alembic check        # model = göç mü? (2. görevden itibaren anlamlı)
#
# Göçler NEREDE koşar: dağıtım öncesi tek seferlik komutta (9. görev,
# `tools/goc.py`), konteyner açılışında DEĞİL — iki replika yarışır.

[alembic]
script_location = %(here)s/alembic
# Dosya adı `NNNN_slug.py`: sıra dosya listesinde okunsun (`0000_zemin.py`,
# `0001_…`). `revision` alanı da aynı dizeyi taşıyor.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
