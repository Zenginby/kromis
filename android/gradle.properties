android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Chaquopy derleme sırasında Python çalışma zamanını ve tüm wheel'leri açıp
# APK'ya gömüyor; varsayılan 512 MB heap ile Pillow + CPython stdlib adımında
# OOM'a düşüyor.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Yalnızca gerçekten kullanılan ABI paketlensin. `abiFilters` zaten arm64-v8a
# diyor; bu bayrak Chaquopy'nin ve AGP'nin gereksiz ABI'ları hiç indirmemesini
# sağlıyor (APK boyutu neredeyse iki katına çıkardı).
android.defaults.buildfeatures.buildconfig=true
