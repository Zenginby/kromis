# Android paketinin ÇİVİLENMİŞ sürümleri — TEK kaynak.
#
# Buradaki değerler üç yere birden akar:
#   1. android/app/build.gradle → Chaquopy `pip { install ... }` satırları,
#   2. .github/workflows/build-pydantic-core-android.yml → derlenecek wheel,
#   3. android/wheels/ altındaki dosya adı.
#
# NEDEN ÇİVİLİ (masaüstünün requirements.txt'i pydantic'i hiç anmıyorken):
# pydantic-core Android wheel'ini BİZ derliyoruz (bkz. docs/android/pydantic-karari.md).
# Chaquopy'nin pip'i `pydantic` çözerken serbest bırakılırsa bir gün elimizdeki
# wheel'in EŞLEŞMEDİĞİ bir pydantic sürümü seçer; pydantic ile pydantic-core
# sürümleri birbirine sıkı bağlı (pydantic 2.13.4 tam olarak pydantic-core
# 2.46.4 ister) ve uyuşmazlık `PydanticUserError` ile ÇALIŞMA ANINDA patlar —
# derlemede değil. Yani çivi olmadan kırılma ancak telefonda görülürdü.
#
# Masaüstü bu dosyadan HİÇ etkilenmez: requirements.txt'e dokunulmadı, sürüm
# serbest kalmaya devam ediyor.
#
# GÜNCELLEME SIRASI (ikisi birlikte, tek commit'te):
#   1. pydanticVersion + pydanticCoreVersion'ı yeni çifte çek,
#   2. build-pydantic-core-android.yml'i elle tetikleyip yeni wheel'i üret,
#   3. android/wheels/ altındaki eski .whl'i yenisiyle DEĞİŞTİR (biriktirme:
#      Chaquopy dizindeki her wheel'i değil, adı yazılanı kurar ama bayat
#      dosyalar APK'yı şişirir).
pydanticVersion=2.13.4
pydanticCoreVersion=2.46.4

# Chaquopy'nin cihazda koşturduğu Python. Wheel'in `cp<XY>` etiketi bununla
# BİREBİR aynı olmak zorunda: cp313 wheel'i cp312 çalışma zamanına kurulmaz,
# pip onu "uyumsuz" diye sessizce atlar ve `import pydantic_core` cihazda
# ModuleNotFoundError verir.
pythonVersion=3.13

# Wheel etiketindeki API seviyesi (`android_<API>_arm64_v8a`). Bu sayı wheel'in
# desteklediği EN DÜŞÜK API'dir, yani minSdk'dan BÜYÜK olamaz — büyük olursa
# pip cihazda wheel'i uyumsuz sayar.
wheelAndroidApi=26
