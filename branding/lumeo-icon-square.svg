<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lumeo uygulama simgesi (favicon, macOS/Windows paket ikonu, Android eski
  mipmap yoğunlukları için TEK kaynak). Diyafram işareti lumeo-mark.svg ile
  birebir aynı geometri; burada 512×512 tuvale ortalanmış ve koyu, hafif
  degrade bir kare arka plan eklendi (Android'in adaptive-icon arka planıyla
  aynı ton ailesi: flow-tokens.css'teki surface / bg tokenları).

  tools/render_brand_assets.py bu dosyayı gerekli tüm PNG boyutlarına
  (favicon, .ico, .iconset, Android mipmap) render eder.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b21" />
      <stop offset="1" stop-color="#0a0a0b" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)" />
  <g transform="translate(96 96) scale(5)" fill="#B48DF4">
    <ellipse cx="32" cy="15.5" rx="6.6" ry="16.5" opacity="0.95" />
    <ellipse cx="32" cy="15.5" rx="6.6" ry="16.5" opacity="0.6" transform="rotate(60 32 32)" />
    <ellipse cx="32" cy="15.5" rx="6.6" ry="16.5" opacity="0.95" transform="rotate(120 32 32)" />
    <ellipse cx="32" cy="15.5" rx="6.6" ry="16.5" opacity="0.6" transform="rotate(180 32 32)" />
    <ellipse cx="32" cy="15.5" rx="6.6" ry="16.5" opacity="0.95" transform="rotate(240 32 32)" />
    <ellipse cx="32" cy="15.5" rx="6.6" ry="16.5" opacity="0.6" transform="rotate(300 32 32)" />
  </g>
  <circle cx="256" cy="256" r="21" fill="none" stroke="#B48DF4" stroke-width="8" opacity="0.95" />
</svg>
