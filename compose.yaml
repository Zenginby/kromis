# YALNIZ YEREL GELİŞTİRME İÇİN (Faz 0 / Adım 8) — üretim dağıtımı değil.
#
# Burada ne TLS, ne kimlik, ne yeniden başlatma politikası, ne kaynak sınırı
# var; hepsi Faz 1'in dağıtım kararlarıyla birlikte gelir. Dosyanın işi tek:
# `docker compose up --build` deyip `http://localhost:8765`i ve `/health`i
# görmek — imaj gerçekten açılıyor mu, veri birimi gerçekten yazılıyor mu.
#
#   cp .env.example .env      # isteğe bağlı; yoksa Dockerfile'ın varsayılanları
#   docker compose up --build
#   curl localhost:8765/health
#
# `env_file` `required: false`: `.env` yoksa compose şikâyet etmesin
# (Compose v2.24+). Dosya yalnız KROMIS_DATA_DIR/PORT gibi altyapı
# değişkenlerini taşır; KULLANICI anahtarları SÜREÇ ORTAMINDAN OKUNMUYOR —
# gerekçesi .env.example'da. PLATFORMUN anahtarı ise (Faz 2 / 6,
# `KROMIS_PLATFORM_<AD>`, .env.example 1d) yerelde `.env`den gelir: `env_file`
# onu HEM `kromis` HEM `isci` servisine taşır (ikisi de okur), platformda aynı
# ad sır olarak girilir.
#
# POSTGRES (Faz 1 / 1. görev): `/health` artık `db_reachable` ölçüyor, DB'siz
# konteyner 503 verir. `postgres:17-alpine` yalnız geliştirme için — parola
# `kromis`, TLS yok, birim yerel; üretimde yönetilen Postgres (Neon/Supabase
# vb.) ve `DATABASE_URL` ortamdan gelir. `environment:` `env_file`i EZER:
# `.env`e `DATABASE_URL=` boş bile yazılsa uygulama bu adresi görür.
# `depends_on … service_healthy`: uygulama Postgres kabul etmeden açılmasın,
# yoksa ilk saniyelerde sonda sebepsiz 503 der.
#
# GÖÇ AYRI SERVİSTE (Faz 1 / 9, K6): `goc` aynı imajla `python tools/goc.py`
# koşturur ve biter; `kromis` onu `service_completed_successfully` ile bekler.
# Uygulama konteynerinin CMD'si YALNIZ uvicorn — iki replika aynı anda açılırsa
# iki `alembic upgrade` yarışır, Alembic kilit tutmaz. Bu düzen yönetilen
# platformların "dağıtım öncesi komut"unun yerel ikizi (Fly `release_command`,
# Railway/Render pre-deploy; KURULUM.md). `KROMIS_GOC_ACILISTA=1` gibi bir
# "açılışta göç" bayrağı BİLEREK YOK: tek replikada rahat, ikincisinde tuzak.
# `image: kromis` üç serviste de aynı ad (`goc`, `kromis`, `isci`): compose
# sonraki derlemeleri önbellekten alır, farklı imaj adları farklı derlemeler
# gibi görünürdü.
services:
  goc:
    build: .
    image: kromis
    command: ["python", "tools/goc.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://kromis:kromis@postgres:5432/kromis
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  kromis:
    build: .
    image: kromis
    ports:
      - "8765:8765"
    volumes:
      # Adlandırılmış birim, bind-mount DEĞİL: birim ilk bağlanışta imajdaki
      # `/data`nın sahipliğini (uid 10001) alır ve yazılabilir doğar. Bir
      # konak dizini bağlanacaksa önce `chown 10001` — yoksa `/health` 503.
      - kromis-data:/data
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://kromis:kromis@postgres:5432/kromis
      # Sağlayıcı anahtarlarının ŞİFRELEME anahtarı (Faz 1 / 7; services/sifre.py).
      # Bu dosyaya değer YAZILMIYOR — sabit bir geliştirme anahtarı bile git'te
      # bir anahtar olurdu ve "şifreli" sütunu depoyu okuyan herkese açardı.
      # Compose değeri kabuktan ya da yanındaki `.env`den alır (`${…}` yorumlama);
      # yoksa `:?` mesajıyla DURUR — uygulama da anahtarsız açılmadığı için hata
      # ilk komutta, konteyner içinde değil burada görünür. Üretmek için
      # `.env.example`daki komut.
      KROMIS_SECRET_KEY: ${KROMIS_SECRET_KEY:?KROMIS_SECRET_KEY gerekli - .env.example'daki komutla uretip .env'e yazin}
      # Çerezlerin `Secure` bayrağı burada KAPALI (Faz 1 / 3; services/cerez.py):
      # compose `http://localhost:8765`te düz HTTP ve Safari orada Secure
      # çerezi saklamıyor — oturum açılır, çerez düşer, kullanıcı hep 401
      # görürdü. YALNIZ bu dosyada; TLS arkasındaki dağıtımda bu satır yok.
      # Posta arka ucu boş bırakılıyor: anahtar yoksa konsol (`posta.log`).
      KROMIS_GUVENLI_CEREZ: "0"
    depends_on:
      postgres:
        condition: service_healthy
      goc:
        condition: service_completed_successfully

  # İŞÇİ (Faz 2 / 3): aynı imaj, başka komut — üretim işlerini kuyruktan alır
  # (services/isci.py). Web ile AYNI birimi paylaşır: yerel kipte medya diskte
  # (`/data`), işçinin yazdığını web ancak aynı dizinden görebilir; platformda
  # ikisi ayrı makinede koşar ve ortak zemin nesne depolama (`KROMIS_NESNE_DEPO_*`,
  # .env.example). Göçü bekler (`goc` → `service_completed_successfully`): şema
  # kurulmadan açılan işçi `isciler`e yazamaz ve çıkar. Port açmaz: dışarıdan
  # konuşulmaz, yalnız DB ile. Kapanış SIGTERM: eldeki işi bitirir, sonra çıkar
  # (`stop_grace_period` sağlayıcı çağrısının süresine göre; 10. görev).
  isci:
    build: .
    image: kromis
    command: ["python", "isci.py"]
    volumes:
      - kromis-data:/data
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://kromis:kromis@postgres:5432/kromis
      KROMIS_SECRET_KEY: ${KROMIS_SECRET_KEY:?KROMIS_SECRET_KEY gerekli - .env.example'daki komutla uretip .env'e yazin}
    depends_on:
      postgres:
        condition: service_healthy
      goc:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kromis
      POSTGRES_PASSWORD: kromis
      POSTGRES_DB: kromis
    ports:
      # Yalnız loopback: konakta `uvicorn app:app` ya da `alembic` koşturan
      # geliştirici `localhost:5432`e bağlanabilsin, ağdaki başka kimse değil.
      - "127.0.0.1:5432:5432"
    volumes:
      - kromis-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kromis -d kromis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kromis-data:
  kromis-postgres:
