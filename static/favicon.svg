<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lumeo marka simgesi — diyafram/iris konsepti.

  Altı yaprak, merkez etrafında 60° aralıklarla döndürülmüş aynı elips;
  tek/çift yapraklar farklı opaklıkla ışık-gölge hissi verir (gerçek kamera
  irisindeki yaprak bindirmesine gönderme). Ortadaki halka açıklığı temsil
  eder. Renk, uygulamanın "Viola" tema aksanının (oklch(72% .15 300)) sRGB
  karşılığıdır — flow-tokens.css'teki accent tanımıyla birebir eşleşir.

  Bu dosya TEK kaynaktır: favicon, macOS .icns, Windows .ico ve Android
  launcher simgesi buradan üretilir (bkz. tools/render_brand_assets.py).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g fill="#B48DF4">
    <ellipse cx="32" cy="15.5" rx="6.6" ry="16.5" opacity="0.95" />
    <ellipse cx="32" cy="15.5" rx="6.6" ry="16.5" opacity="0.6" transform="rotate(60 32 32)" />
    <ellipse cx="32" cy="15.5" rx="6.6" ry="16.5" opacity="0.95" transform="rotate(120 32 32)" />
    <ellipse cx="32" cy="15.5" rx="6.6" ry="16.5" opacity="0.6" transform="rotate(180 32 32)" />
    <ellipse cx="32" cy="15.5" rx="6.6" ry="16.5" opacity="0.95" transform="rotate(240 32 32)" />
    <ellipse cx="32" cy="15.5" rx="6.6" ry="16.5" opacity="0.6" transform="rotate(300 32 32)" />
  </g>
  <circle cx="32" cy="32" r="4.2" fill="none" stroke="#B48DF4" stroke-width="1.6" opacity="0.95" />
</svg>
