<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GPT-Image Studio</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-text">
      <h1>GPT-Image <span>Studio</span></h1>
      <p class="sub">Azure gpt-image-2 · yerel</p>
    </div>
    <button id="settings-btn" class="icon-btn" type="button" aria-label="Azure ayarları" title="Azure ayarları">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <main class="layout">
    <section class="controls" aria-label="Üretim kontrolleri">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" rows="6" placeholder="Ne üretmek istersin? Bir görsel eklersen prompt onun üzerinde çalışır."></textarea>

      <div class="row">
        <div>
          <label for="size">Boyut</label>
          <select id="size">
            <option value="1024x1024">Kare 1024²</option>
            <option value="1024x1536">Dikey 1024×1536</option>
            <option value="1536x1024">Yatay 1536×1024</option>
          </select>
        </div>
        <div>
          <label for="quality">Kalite</label>
          <select id="quality">
            <option value="low">Düşük</option>
            <option value="medium" selected>Orta</option>
            <option value="high">Yüksek</option>
          </select>
        </div>
        <div>
          <label for="n">Adet</label>
          <select id="n"><option>1</option><option>2</option><option>3</option><option>4</option></select>
        </div>
      </div>

      <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp" hidden />
      <div class="ref-row">
        <button type="button" id="upload-btn" class="btn-ghost">
          <span class="btn-ghost-plus" aria-hidden="true">+</span> Görsel ekle
        </button>
        <span id="ref-chip" class="ref-chip" hidden>
          <span id="ref-label"></span>
          <button type="button" id="ref-clear" aria-label="Referansı kaldır">×</button>
        </span>
      </div>

      <button id="go" class="primary">Üret</button>
      <p id="status" class="status" role="status"></p>
    </section>

    <section class="stage" aria-label="Önizleme">
      <div id="progress" class="progress" hidden aria-hidden="true">
        <div class="spinner"></div>
        <div class="bar"><div id="progress-fill" class="bar-fill"></div></div>
        <span id="progress-pct" class="pct">0%</span>
      </div>
      <div id="preview" class="preview empty">
        <span id="preview-empty" class="preview-empty">Henüz görsel yok · bir görseli buraya sürükle-bırak</span>
        <img id="preview-img" class="preview-img" alt="" hidden />
        <button id="preview-clear" class="preview-clear" type="button" hidden
                aria-label="Görseli ekrandan kaldır" title="Ekrandan kaldır">×</button>
      </div>
    </section>
  </main>

  <section class="gallery-wrap" aria-label="Geçmiş">
    <h2>Geçmiş</h2>
    <div id="gallery" class="gallery"></div>
  </section>

  <div id="settings-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-head">
        <h2 id="settings-title">Azure Ayarları</h2>
        <button id="settings-close" class="modal-x" type="button" aria-label="Kapat">×</button>
      </div>
      <p class="modal-desc">
        gpt-image-2 erişim bilgileri. Yalnızca bu makineye kaydedilir (izin 0600).
        API anahtarı ekranda hiçbir zaman gösterilmez.
      </p>

      <label for="set-endpoint">Endpoint (Base URL)</label>
      <input id="set-endpoint" type="url" autocomplete="off" spellcheck="false"
             placeholder="https://…/openai/v1/" />

      <label for="set-key">API Key</label>
      <input id="set-key" type="password" autocomplete="off" spellcheck="false"
             placeholder="Azure API anahtarını yapıştır" />

      <p id="settings-status" class="modal-status" role="status"></p>
      <div class="modal-actions">
        <button id="settings-save" class="primary" type="button">Kaydet</button>
      </div>
    </div>
  </div>

  <div id="logo-modal" class="modal" hidden>
    <div class="modal-backdrop" data-logo-close></div>
    <div class="modal-card logo-card" role="dialog" aria-modal="true" aria-labelledby="logo-title">
      <div class="modal-head">
        <h2 id="logo-title">Logo Bindir</h2>
        <button id="logo-close" class="modal-x" type="button" aria-label="Kapat">×</button>
      </div>

      <div class="logo-body">
        <div class="logo-preview-wrap">
          <img id="logo-preview-img" class="logo-preview-img" alt="Logo önizleme" />
          <div id="logo-preview-spin" class="logo-preview-spin" hidden><div class="spinner"></div></div>
        </div>

        <div class="logo-controls">
          <label>Konum</label>
          <div id="logo-grid" class="logo-grid" role="group" aria-label="Logo konumu">
            <button type="button" data-pos="top-left"      aria-label="Sol üst">↖</button>
            <button type="button" data-pos="top-center"    aria-label="Üst orta">↑</button>
            <button type="button" data-pos="top-right"     aria-label="Sağ üst">↗</button>
            <button type="button" data-pos="center-left"   aria-label="Sol orta">←</button>
            <button type="button" data-pos="center"        aria-label="Merkez">•</button>
            <button type="button" data-pos="center-right"  aria-label="Sağ orta">→</button>
            <button type="button" data-pos="bottom-left"   aria-label="Sol alt">↙</button>
            <button type="button" data-pos="bottom-center" aria-label="Alt orta">↓</button>
            <button type="button" data-pos="bottom-right"  aria-label="Sağ alt">↘</button>
          </div>

          <label>Renk</label>
          <div id="logo-color" class="seg" role="group" aria-label="Logo rengi">
            <button type="button" data-color="auto">Oto</button>
            <button type="button" data-color="blue">Mavi</button>
            <button type="button" data-color="white">Beyaz</button>
          </div>

          <label for="logo-size">Boyut <span id="logo-size-val" class="range-val">14%</span></label>
          <input id="logo-size" type="range" min="6" max="40" value="14" />

          <label for="logo-shadow">Gölge yoğunluğu <span id="logo-shadow-val" class="range-val">47%</span></label>
          <input id="logo-shadow" type="range" min="0" max="100" value="47" />

          <label for="logo-blur">Gölge bulanıklığı <span id="logo-blur-val" class="range-val">6</span></label>
          <input id="logo-blur" type="range" min="0" max="30" value="6" />
        </div>
      </div>

      <p id="logo-status" class="modal-status" role="status"></p>
      <div class="modal-actions">
        <button id="logo-apply" class="primary" type="button">Uygula</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
